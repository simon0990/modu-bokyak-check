/* ---------- A6~A9 + C1 리포트 (한 페이지 스크롤) ---------- */
/* ---------- 공유 카드 — 이 3040 변형의 핵심 ----------
   9:16에 가까운 세로 카드를 renderReport() 최상단에 둔다. 스크린샷해서 인스타
   스토리에 올리는 것이 전제라, 판정(주의 有/無)과 무관하게 항상 같은 톤으로
   그린다 — "주의 0건"이라고 카드 색이 초록·체크로 바뀌지 않는다(§3 금지 규칙).
   findings 중 info 등급은 뺀다 — 카드의 N 도 res.n 처럼 warn/time/check 만 센다. */
/* 공유 카드는 남에게 보여지는 유일한 화면이다. 따라서 **약 이름·건기식 이름·특이사항을
   절대 싣지 않는다.** 처방약 목록과 임신·수유 같은 특이사항은 개인정보보호법 §23 민감정보이고,
   출시전략 §7의 판정도 같다 — "개인 리포트는 민감정보라 공유되지 않는다. 공유 단위는 익명 조합 카드".
   실을 수 있는 것은 개수와 등급 분포뿐이다. */
/* ==========================================================================
   조합 유형 (30·40대 변형 v2) — 8종

   유형은 **「무엇을 먹는가」만** 말한다. 「안전한가」는 절대 말하지 않는다.
   그래서 typeOfSupps() 는 supps 배열 하나만 읽는다. state.rx / state.conds /
   analyze() 결과를 끌어들이는 순간 P4 원칙(주의 없음 ≠ 문제 없음)이 무너지고,
   동시에 공유 카드에 민감정보가 새어 들어갈 통로가 생긴다.
   계열은 3종씩 4계열로 균등하다. 크기가 다르면(v1 의 5/3/2/2) 큰 계열이 항상
   이겨서 작은 계열 유형이 구조적으로 죽는다.
   ⚠ 아연을 「미용」, 철분을 「장·간·혈」에 둔 것은 검수 대상이다.
   ========================================================================== */
const TYPE_CATS = [
  { key: 'basic',  label: '기초',     ids: ['multi', 'vitd', 'mag'] },
  { key: 'vital',  label: '활력',     ids: ['omega3', 'redgin', 'protein'] },
  { key: 'beauty', label: '미용',     ids: ['collagen', 'lutein', 'zinc'] },
  { key: 'gut',    label: '장·간·혈', ids: ['probio', 'milk', 'iron'] }
];
const TYPE_KEYS = TYPE_CATS.map(function (t) { return t.key; });

/* 이모지를 쓰지 않는다 — 렌더 색을 통제할 수 없어 초록 유입 경로가 된다. */
const TYPES = {
  none:    { icon: 'i-t-none',    name: '관망 중',       line: '아직 고른 것이 없어요' },
  minimal: { icon: 'i-t-minimal', name: '미니멀 베이스', line: '필요한 자리에 하나씩만 얹는 편' },
  basic:   { icon: 'i-t-basic',   name: '기초 다지기',   line: '매일의 바탕부터 채우는 편' },
  vital:   { icon: 'i-t-vital',   name: '컨디션 관리',   line: '체력·혈행 쪽에 무게를 둔 편' },
  beauty:  { icon: 'i-t-beauty',  name: '겉모습 케어',   line: '피부·눈·모발을 챙기는 편' },
  gut:     { icon: 'i-t-gut',     name: '속 관리',       line: '장·간·혈액 쪽을 먼저 챙기는 편' },
  broad:   { icon: 'i-t-broad',   name: '올라운드',      line: '네 계열을 빠짐없이 채우는 편' },
  stack:   { icon: 'i-t-stack',   name: '스택 빌더',     line: '두세 계열을 같은 비중으로 겹쳐 쌓는 편' }
};

/* ---------------------------------------------------------------------------
   유형 희소도 — 사주의 「상위 3%」 자리를 정직하게 채우는 숫자.

   ⚠ 12종 전수 4095가지 시뮬레이션 결과 · 실사용 분포 아님.
   SUPP_LIST 12종에서 1개 이상 고르는 모든 조합 2^12-1 = 4095가지에
   typeOfSupps() 를 그대로 돌려 센 값이다. 서비스 이용자가 이 비율로
   나뉜다는 뜻이 **아니다** — 실사용 분포 데이터는 아직 없다.
   그래서 화면 문구는 반드시 「가능한 조합 중」으로 쓴다. 「사용자 중」으로
   바꿔 쓰면 없는 데이터를 있는 척하는 것이 된다.

   none(아무것도 고르지 않음)은 4095가지 안에 없으므로 비율을 두지 않는다.
   SUPP_LIST·TYPE_CATS·typeOfSupps() 중 하나라도 바뀌면 이 표를 다시 돌려야 한다.
   --------------------------------------------------------------------------- */
const RARITY_TOTAL = 4095;
const TYPE_RARITY = {
  broad:   29.6,   /* 1213 / 4095 */
  stack:   13.9,   /*  568 / 4095 */
  basic:   13.1,   /*  538 / 4095 */
  vital:   13.1,   /*  538 / 4095 */
  beauty:  13.1,   /*  538 / 4095 */
  gut:     13.1,   /*  538 / 4095 */
  minimal:  4.0    /*  162 / 4095 */
};
/* 4095 → "4,095". Intl 없이도 되게 직접 찍는다. */
function comma(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* 계열 일반론. 개인 판정이 아니다. ⚠ 검수 전 — 약사 검수 필요 */
const TYPE_NOTE = {
  none:    '지금 드시는 약만으로도 대조할 것이 있습니다. 처방약끼리, 그리고 앞으로 더할 영양제와의 조합을 미리 보아 두면 도움이 됩니다.',
  minimal: '가짓수가 적다고 대조가 끝나는 것은 아닙니다. 복합제 1개는 성분으로는 여러 개라, 개수보다 성분표를 먼저 보는 편이 정확합니다.',
  basic:   '종합비타민은 겉보기 1개지만 성분으로는 열 가지가 넘습니다. 단일 제품을 함께 드실 때 같은 성분이 두 번 들어가는지부터 보는 것이 일반적인 점검 순서입니다.',
  vital:   '이 계열에는 혈액이 굳는 속도에 영향을 준다고 보고된 성분이 섞여 있습니다. 소염진통제처럼 같은 특성을 가진 약과 겹치는지가 흔한 점검 지점입니다.',
  beauty:  '루테인 같은 지용성 성분은 기름과 함께 흡수되고, 아연은 다른 미네랄과 같은 흡수 통로를 나눠 씁니다. 무엇과 같은 시간에 먹느냐가 흡수량을 바꿉니다.',
  gut:     '이 계열은 흡수와 대사 경로에 얽히는 성분이 많습니다. 철분은 다른 약의 흡수를 막을 수 있고, 밀크씨슬은 간에서 약과 같은 효소를 씁니다.',
  broad:   '계열이 넓게 퍼지면 서로 다른 제품에 같은 성분이 중복으로 들어가기 쉽습니다. 아연·마그네슘·비타민D는 특히 여러 제품에 함께 들어가는 성분입니다.',
  stack:   '같은 계열을 겹쳐 쌓으면 성분보다 용량이 먼저 쌓입니다. 같은 성분의 하루 총량이 얼마인지 합산해 보는 것이 일반적인 점검 방법입니다.'
};

/* 판정 — supps 배열 하나만 읽는다. 가족 보드에서도 재사용하므로 인자를 받는다. */
function typeOfSupps(supps) {
  const cats = {};
  TYPE_CATS.forEach(function (t) {
    cats[t.key] = t.ids.filter(function (id) { return has(supps, id); }).length; });
  const n = supps.length;
  if (!n) return { key: 'none', cats: cats, n: 0, span: 0, top: null };

  const span = TYPE_KEYS.filter(function (k) { return cats[k] > 0; }).length;
  const rank = TYPE_KEYS.slice().sort(function (a, b) {
    return cats[b] - cats[a] || TYPE_KEYS.indexOf(a) - TYPE_KEYS.indexOf(b); });
  const top = rank[0], c1 = cats[top], c2 = cats[rank[1]];

  let key;
  if (c1 > c2 && c1 * 3 >= n) key = top;   /* 단독 최다 & 전체의 1/3 이상 */
  else if (n <= 3)            key = 'minimal';
  else if (span >= 4)         key = 'broad';
  else                        key = 'stack';
  return { key: key, cats: cats, n: n, span: span, top: (key === top ? top : null) };
}
function typeOf() { return typeOfSupps(state.supps); }

/* 판정 이유 한 줄 — 유형이 임의로 붙은 것이 아님을 보이는 자리.
   개수를 노출하므로 **공유 카드에 넣지 않는다.** 리포트 본문 전용. */
function typeWhy(t) {
  if (t.key === 'none') {
    return state.customs.length
      ? '직접 적어 주신 것은 계열을 알 수 없어 유형 계산에서 빠집니다.'
      : '아직 고르신 것이 없습니다.';
  }
  if (t.top) {
    const label = TYPE_CATS.filter(function (c) { return c.key === t.top; })[0].label;
    return '고르신 ' + t.n + '개 중 ' + t.cats[t.top] + '개가 「' + label + '」 계열입니다.';
  }
  if (t.key === 'minimal') return '고르신 ' + t.n + '개가 서로 다른 계열에서 하나씩입니다.';
  if (t.key === 'broad')   return '네 계열 모두에 걸쳐 있고, 특별히 몰린 계열이 없습니다.';
  return t.span + '개 계열에 ' + t.n + '개가 같은 비중으로 나뉘어 있습니다.';
}

/* 4축 레이더. 인라인 SVG 라 외부 요청이 없다. 축은 위·오른쪽·아래·왼쪽 순. */
const RADAR_DIR = [[0, -1], [1, 0], [0, 1], [-1, 0]];
/* v2 — 자기 최대값이 아니라 계열 크기(3)로 정규화한다. 자기 최대값으로 맞추면
   1개 먹는 사람과 9개 먹는 사람의 그래프가 같은 크기로 그려져 비교가 성립하지 않는다. */
function radarPoint(cats, key, i) {
  const v = cats[key] ? 0.3 + 0.7 * (cats[key] / 3) : 0.07;
  return [50 + RADAR_DIR[i][0] * 34 * v, 50 + RADAR_DIR[i][1] * 34 * v];
}
function radar(cats) {
  const order = TYPE_CATS.map(function (t) { return t.key; });
  const pts = order.map(function (k, i) {
    const p = radarPoint(cats, k, i);
    return p[0].toFixed(1) + ',' + p[1].toFixed(1);
  });
  const ring = function (f) {
    return '<polygon class="rd-ring" points="' + RADAR_DIR.map(function (d) {
      return (50 + d[0] * 34 * f).toFixed(1) + ',' + (50 + d[1] * 34 * f).toFixed(1);
    }).join(' ') + '"/>';
  };
  const dots = order.map(function (k, i) {
    const p = radarPoint(cats, k, i);
    return '<circle class="rd-dot' + (cats[k] ? '' : ' off') + '" cx="' + p[0].toFixed(1) +
           '" cy="' + p[1].toFixed(1) + '" r="2.8"/>';
  }).join('');

  return '<div class="rd-wrap">' +
    '<span class="rd-l t">기초</span><span class="rd-l r">활력</span>' +
    '<span class="rd-l b">미용</span><span class="rd-l l">장·간·혈</span>' +
    '<svg class="rd" viewBox="0 0 100 100" role="img" aria-label="영양제 구성 그래프">' +
      ring(1) + ring(0.62) + ring(0.3) +
      '<line class="rd-ax" x1="50" y1="16" x2="50" y2="84"/>' +
      '<line class="rd-ax" x1="16" y1="50" x2="84" y2="50"/>' +
      '<polygon class="rd-area" points="' + pts.join(' ') + '"/>' + dots +
    '</svg>' +
  '</div>';
}

/* 대조한 쌍을 점 하나씩. 등급이 나온 쌍만 색이 들어온다.
   이름을 싣지 않으면서 "몇 쌍을 훑었는지"가 눈에 보이게 하는 것이 목적이라
   공유 카드가 아니라 리포트 본문에 둔다(카드는 공유용, 격자는 이해용). */
const MAX_DOTS = 72;
function dotGrid(res, k) {
  const seq = [];
  ['warn', 'time', 'check'].forEach(function (lv) {
    for (let i = 0; i < res.counts[lv]; i++) seq.push(lv);
  });
  let dots = '';
  for (let i = 0; i < Math.min(k, MAX_DOTS); i++) {
    dots += '<span class="sc-dot' + (seq[i] ? ' sc-' + seq[i] : '') + '"></span>';
  }
  return '<div class="card fx-col gap-sm">' +
    '<div class="sc-grid">' + dots + '</div>' +
    '<div class="sc-stat"><b>' + k + '</b>쌍을 하나씩 대조했어요' +
      (k > MAX_DOTS ? ' <span class="sc-more">(그림은 ' + MAX_DOTS + '쌍까지)</span>' : '') + '</div>' +
    levelChips(res) +
  '</div>';
}

function levelChips(res) {
  const dist = [
    { key: 'warn',  label: '주의' },
    { key: 'time',  label: '시간 조정' },
    { key: 'check', label: '확인 권장' }
  ].filter(function (d) { return res.counts[d.key] > 0; });
  return dist.length
    ? '<div class="sc-chips">' + dist.map(function (d) {
        return '<span class="sc-chip sc-' + d.key + '"><i></i>' + d.label + ' ' + res.counts[d.key] + '</span>';
      }).join('') + '</div>'
    : '<div class="sc-chips"><span class="sc-chip sc-none">이번 조합에서 확인된 신호 없음 · 확인하지 못한 것 ' +
        coverageMissing(res).length + '가지</span></div>';
}

/* 유형 공개 — 분석 직후 가장 먼저 보이는 블록.
   유형색 딥 그라데이션 + 흰 텍스트. 아이콘 → 이름 → 한 줄 → 희소도 순으로
   들어온다(스태거는 CSS. prefers-reduced-motion:reduce 는 @media 가 처리한다).
   ⚠ 이 연출은 「유형」에만 걸린다. 판정(주의 N건) 쪽에는 절대 걸지 않는다 —
     주의 0건이 가장 흔한 결과인데 거기에 축하 연출이 붙으면 P4 가 깨진다. */
function rarityLine(key) {
  const p = TYPE_RARITY[key];
  if (p === undefined) return '';       /* none — 4095가지 안에 없는 상태 */
  return '<div class="rv-rare"><span>' + comma(RARITY_TOTAL) + '가지 조합 중</span>' +
      '<b class="num">' + p.toFixed(1) + '%</b></div>' +
    '<div class="rv-rare-src">영양제 12종으로 만들 수 있는 조합 ' + comma(RARITY_TOTAL) +
      '가지를 전부 돌려 센 비율입니다. 이용자 분포가 아닙니다.</div>';
}

function typeReveal(t) {
  const T = TYPES[t.key];
  return '<div class="wf-reveal tp-' + t.key + '">' +
    '<div class="rv-cap">내 영양제 조합 유형</div>' +
    '<div class="rv-icon">' + ico(T.icon, 'fx-ico xl') + '</div>' +
    '<div class="rv-name">' + T.name + '</div>' +
    '<div class="rv-line">' + T.line + '</div>' +
    rarityLine(t.key) +
    '<div class="rv-why">' + typeWhy(t) + '</div>' +
  '</div>';
}

function shareCard(res, m, k) {
  const t = typeOf();
  const T = TYPES[t.key];

  /* 카드에도 희소도를 싣는다 — 캡처본이 혼자 돌아다녀도 「가능한 조합 중」이라는
     단서가 함께 따라가야 하므로, 퍼센트만 두지 않고 4,095 를 같이 박는다. */
  const p = TYPE_RARITY[t.key];
  const rare = (p === undefined) ? '' :
    '<div class="sc-rare"><span>' + comma(RARITY_TOTAL) + '가지 조합 중</span>' +
      '<b>' + p.toFixed(1) + '%</b></div>';

  return '<div class="wf-sharecard tp-' + t.key + '">' +
    '<div class="sc-top">' +
      '<span class="sc-badge">내 영양제 조합 유형</span>' +
      ico(T.icon, 'sc-icon') +
      '<span class="sc-tname">' + T.name + '</span>' +
      /* typeWhy() 는 개수를 노출하므로 카드에 싣지 않는다. */
      '<div class="sc-tline">' + T.line + '</div>' +
      rare +
    '</div>' +
    '<div class="sc-mid">' + radar(t.cats) + '</div>' +
    '<div class="sc-bot">' +
      '<div class="sc-stat"><b>' + m + '</b>개가 만나는 <b>' + k + '</b>쌍을 대조했어요</div>' +
      levelChips(res) +
    '</div>' +
    '<div class="sc-foot">' +
      '<span class="sc-word">모두의 복약</span>' +
      '<span class="sc-tag">가입 없이 1분</span>' +
    '</div>' +
    /* 카드는 스크린샷으로 앱 밖을 돌아다니는 유일한 반출물이다. 상단 데모 띠와
       하단 고지문은 카드 바깥에 있어 캡처에 따라오지 않으므로, 표식을 카드 안에 박는다. */
    '<div class="sc-demo">검수 전 프로토타입 · 진단이 아닙니다</div>' +
  '</div>';
}

function renderReport() {
  const res = analyze();
  const m = itemCount(), k = pairCount();
  const rx = realRx();
  const t = typeOf();
  const missing = coverageMissing(res);

  /* ---------- 판정 블록 ----------
     P4 를 색이 아니라 레이아웃으로 강제한다. 「0」 옆에 같은 시각 무게의
     「확인하지 못한 것 N」을 두면 눈이 0만 집어 갈 수 없다. */
  const src = (res.nDerived > 0)
    ? '<div class="v-src">규칙에서 ' + res.nCurated + '건 · 성분 특성에서 ' + res.nDerived + '건</div>' : '';

  const verdict = res.n > 0
    ? '<div class="wf-verdict warn"><div class="v-num num">' + res.n + '</div>' +
      '<div class="v-label">가지 확인이 필요해요</div>' +
      '<div class="v-sub">먹는 ' + m + '개가 만나는 ' + k + '쌍을 대조한 결과입니다</div>' + src + '</div>'
    /* ⚠ class="wf-verdict clear" 리터럴을 이 순서 그대로 유지한다 — check.mjs 가 이 문자열을 찾는다 */
    : '<div class="wf-verdict clear">' +
        '<div class="v-pair">' +
          '<div><span class="v-num num">0</span><span class="v-label">확인된 주의 신호</span></div>' +
          '<div><button class="v-jump" data-act="scrollto" data-target="notchecked">' +
            '<span class="v-alt num">' + missing.length + '</span>' +
            '<span class="v-altlabel">확인하지 못한 것</span></button></div>' +
        '</div>' +
        '<div class="v-sub">주의 신호가 없다는 것과 문제가 없다는 것은 다릅니다. 아래 「무엇을 확인하지 못했나요」를 꼭 읽어 주세요.</div>' +
      '</div>';

  /* 확인한 것 */
  const listOr = function (ids, f) {
    return ids.length ? ids.map(f).join(' · ') : '고르신 것이 없습니다';
  };
  const checked = '<div class="card fx-col gap-sm">' +
    '<div class="fx-row gap-sm"><span class="tag ' + (rx.length ? 'rx' : 'gray') + '">처방약 ' + rx.length + '</span>' +
      '<span class="fx-cap">' + listOr(rx, rxName) + '</span></div>' +
    '<div class="fx-row gap-sm"><span class="tag ' + (state.supps.length ? 'suppl' : 'gray') + '">건강기능식품 ' + state.supps.length + '</span>' +
      '<span class="fx-cap">' + listOr(state.supps, suppName) + '</span></div>' +
    (state.age ? '<div class="fx-row gap-sm"><span class="tag gray">' + nameOf(AGE_LIST, state.age) + '</span>' +
      '<span class="fx-cap">' + (realConds().length ? realConds().map(condName).join(' · ') : '해당 사항 없음') + '</span></div>' : '') +
  '</div>';

  /* 상호작용 카드 — 카드 수프가 아니라 한 장의 결과지로 묶는다 */
  const findingsSection = res.findings.length
    ? '<div class="section-title wf-anchor" id="findings">무엇이 문제인가요</div>' +
      '<div class="findings">' + res.findings.map(findingCard).join('') + '</div>'
    : '';

  /* 복용 시간표 */
  const sched = buildSchedule(res);
  /* INFO_RULES 도 level:'warn' 을 가질 수 있어(임신 금기) f.supp 없는 warn 이 생긴다.
     이 배너는 「이 건기식은 시간을 띄워도 소용없다」는 뜻이라 f.supp 가 있는 것만 대상이다. */
  const warnSupps = res.findings.filter(function (f) { return f.level === 'warn' && f.supp; })
    .map(function (f) { return suppName(f.supp); })
    .filter(function (v, i, a) { return a.indexOf(v) === i; });

  const timeSection = sched.length
    ? '<div class="section-title wf-anchor" id="timetable">오늘부터 이렇게 먹어 보세요</div>' +
      '<div class="fx-cap16">시간만 바꿔도 해결되는 것이 있습니다.</div>' +
      '<div class="card" style="margin-top:8px">' +
        '<div class="wf-time">' + sched.map(function (row) {
          const plain = row.items.filter(function (it) { return !it.why; });
          const moved = row.items.filter(function (it) { return it.why; });
          return '<div class="tm-row">' +
            '<div class="tm-when">' + row.slot.label + '<span>' + row.slot.time + '</span></div>' +
            '<div class="tm-what">' +
              (plain.length ? '<div class="n">' + plain.map(function (it) { return it.name; }).join(' · ') + '</div>' : '') +
              moved.map(function (it) {
                return '<div class="n">' + it.name + '</div><div class="why">' + it.why + '</div>';
              }).join('') +
            '</div></div>';
        }).join('') + '</div>' +
      '</div>' +
      (warnSupps.length
        ? '<div class="warn-banner caution" style="margin-top:16px">' + ico('i-alert-triangle') +
          '<span>' + warnSupps.join(' · ') + eunNeun(warnSupps[warnSupps.length - 1]) +
          ' 시간을 띄운다고 해소되는 항목이 아닙니다. 함께 먹는 것 자체를 진료 때 상의해주세요.</span></div>'
        : '') +
      '<div class="wf-disclaim" style="margin-top:16px"><b>복용 시간 제안은 일반적인 기준입니다.</b> ' +
        '처방전에 적힌 복용법이 우선이며, 바꾸기 전에 약사에게 확인해 주세요.</div>'
    : '';

  /* 앱 비교 — 못 하는 것을 없는 척하지 않는다 */
  const cmp = [
    ['이번 조합 1회 분석', true],
    ['가족 여러 명 저장', 'partial'],
    ['가족이 각자 폰에서 보기', false],
    ['결과 저장하고 다시 보기', 'partial'],
    ['약이 바뀌면 자동으로 재확인', false],
    ['복용 시간 알람', false],
    ['약봉투 사진으로 자동 등록', false]
  ].map(function (r) {
    const web = r[1] === 'partial'
      ? '<span class="cp-partial">△</span>'
      : ico(r[1] ? 'i-check' : 'i-minus');
    return '<div class="cp-row"><span class="cp-name">' + r[0] + '</span>' +
      '<span class="cp-web">' + web + '</span>' +
      '<span class="cp-app">' + ico('i-check') + '</span></div>';
  }).join('');

  const appSection =
    '<div class="section-title wf-anchor" id="save">약은 계속 바뀝니다</div>' +
    '<div class="card elevated fx-col gap-sm">' +
      '<div class="fx-lead">오늘 결과는 <b>오늘 조합</b> 기준이에요. 약이 하나만 바뀌어도 결과가 달라집니다.</div>' +
    '</div>' +
    '<div class="section-title">웹에서 되는 것, 앱에서 되는 것</div>' +
    '<div class="card"><div class="wf-compare">' +
      '<div class="cp-row cp-head"><span class="cp-name"></span><span class="cp-web">웹</span><span class="cp-app">앱</span></div>' +
      cmp +
    '</div>' +
    '<div class="fx-cap" style="margin-top:8px">△ = 이 브라우저에서만 됩니다. 기기를 바꾸면 사라집니다.</div></div>' +
    '<div style="height:8px"></div>' +
    '<button class="big-btn primary" data-act="app-soon">' + ico('i-smartphone') + '앱에서 계속 관리하기</button>' +
    (state.appNotice
      ? '<div class="warn-banner info">' + ico('i-alert-circle') +
        '<span>앱 출시 후 연결됩니다. 아직 받으실 수 있는 앱이 없어 링크를 걸어 두지 않았습니다.</span></div>'
      : '') +
    /* 이 링크의 해시에는 약 목록·특이사항이 담긴다. 가족 모드에서는 렌더 자체를 하지 않는다. */
    (state.activeId ? '' :
      '<button class="big-btn secondary" data-act="copy-link">' + ico('i-share') + '내 결과 다시 볼 링크</button>' +
      '<div class="fx-cap fx-center">이 링크에는 고르신 약·영양제가 담겨 있습니다. 남에게 보내지 마세요.</div>') +
    (state.copyFallback
      ? '<div class="fx-col gap-sm"><span class="fx-cap">브라우저가 복사를 막았습니다. 아래 주소를 직접 복사해주세요.</span>' +
        '<input class="input" readonly value="' + esc(state.copyFallback) + '" onclick="this.select()"></div>'
      : '');

  return '<div class="screen-body gap-md stagger">' +
    ctxBar() +
    /* 1. 분석 직후 가장 먼저 보이는 것 = 유형. 결과를 「받는」 순간을 만들어 준다. */
    typeReveal(t) +
    '<div class="section-title first">공유할 결과 카드</div>' +
    '<div class="fx-cap16">스크린샷으로 저장해서 스토리에 올려보세요.</div>' +
    shareCard(res, m, k) +
    '<button class="big-btn primary" data-act="share-card">' + ico('i-camera') + '스크린샷해서 공유하기</button>' +
    '<button class="big-btn secondary" data-act="copy-service-link">' + ico('i-share') + '친구에게 링크 보내기</button>' +
    '<div class="fx-cap fx-center">보내는 링크에는 고르신 약·영양제가 담기지 않습니다.</div>' +
    '<div class="wf-sharehint">캡처한 카드는 진단이 아닙니다 — 참고용으로만 공유해주세요.</div>' +
    '<div class="fx-divider"></div>' +
    verdict +
    dotGrid(res, k) +
    typeNote(t) +
    mechPanel(res) +
    ackBlock() +
    familySection(res) +
    '<div class="section-title">확인한 것</div>' +
    checked +
    (res.findings.length
      ? '<button class="big-btn primary" data-act="scrollto" data-target="findings">무엇이 문제인지 보기' + ico('i-arrow-down') + '</button>'
      : '') +
    findingsSection +
    (sched.length && res.findings.length
      ? '<button class="big-btn primary" data-act="scrollto" data-target="timetable">그럼 어떻게 먹어야 하나요?' + ico('i-arrow-down') + '</button>'
      : '') +
    timeSection +
    coverageSection(res, missing) +
    evLegend() +
    '<div class="warn-banner caution">' + ico('i-repeat') +
      '<span>약이 바뀌면 결과도 바뀝니다. 새 약을 받으시면 다시 확인해주세요.</span></div>' +
    methodBox(res, m, k) +
    '<div class="wf-disclaim">' + DISCLAIMER + '</div>' +
    appSection +
    '<div class="fx-divider"></div>' +
    '<button class="big-btn ghost" data-act="restart">다른 조합으로 다시 해보기</button>' +
    '<button class="big-btn secondary" data-act="to-family">' + ico('i-users') + '우리 가족 복용 점검</button>' +
  '</div>';
}


/* ==========================================================================
   7.1 리포트 조각 — 기전·근거·커버리지
   ========================================================================== */

/* 유형 노트: 판정보다 위로 올리지 않는다. 접힌 채로 44px 만 쓴다. */
function typeNote(t) {
  return '<details class="fold"><summary>이 유형에서 흔한 점검 지점</summary>' +
    '<div class="fold-body">' + TYPE_NOTE[t.key] + '</div></details>';
}

function evBar(ev) {
  if (!ev || !EVIDENCE[ev]) return '';
  const E = EVIDENCE[ev];
  let bars = '';
  for (let i = 0; i < 3; i++) bars += '<i class="' + (i < E.bars ? 'on' : '') + '"></i>';
  return '<span class="ev-bar">' + bars + '<em>근거 ' + E.label + '</em></span>';
}

/* 쉬운 말이 먼저, 전문용어는 뒤 괄호. 이 순서를 뒤집지 않는다. */
function mechChips(f) {
  const ids = (f.mech || []).filter(function (v, i, a) { return a.indexOf(v) === i; });
  const shown = ids.slice(0, 2).map(function (id) {
    const M = mechOf(id); if (!M) return '';
    const F = MECH_FAMILIES.filter(function (x) { return x.id === M.fam; })[0];
    return '<span class="mech-chip">' + ico(F ? F.icon : 'i-file-text', 'fx-ico sm') + M.plain +
      '<em class="mc-term">(' + M.term + ')</em></span>';
  }).join('');
  return shown + (ids.length > 2 ? '<span class="mech-chip">+' + (ids.length - 2) + '</span>' : '');
}

function findingCard(f) {
  const L = LEVELS[f.level];
  const meta = mechChips(f) + evBar(f.ev);
  const detail = (f.mech || []).map(function (id) { const M = mechOf(id); return M ? M.detail : ''; })
    .filter(Boolean).slice(0, 2).join(' ');
  const via = (f.via || []).filter(function (v, i, a) { return a.indexOf(v) === i; })
    .map(ingName).join(' · ');
  const why = detail
    ? '<details class="f-why"><summary>왜 그런가요</summary>' +
        '<p class="fw-detail">' + detail + '</p>' +
        (via ? '<p class="fw-via"><b>이 판정을 만든 성분</b> — ' + via + '</p>' : '') +
      '</details>'
    : '';
  return '<div class="wf-find ' + L.cls + '">' +
    (f.rule ? '<span class="f-rule">' + esc(f.rule).toUpperCase() + '</span>' : '') +
    '<span class="f-lv">' + ico(L.icon, 'fx-ico sm') + L.label + '</span>' +
    '<div class="wf-pair">' + f.pair.map(function (p, i) {
      return (i ? '<span class="p-x">×</span>' : '') + p;
    }).join('') + '</div>' +
    (meta ? '<div class="f-meta">' + meta + '</div>' : '') +
    '<div class="f-what">' + f.what + '</div>' +
    '<div class="f-do">' + ico(L.doIcon) + '<span>' + f.how + '</span></div>' +
    why +
    (f.derived ? '<span class="f-stamp">성분 특성에서 자동 도출 · 약사 검수 전</span>' : '') +
  '</div>';
}

/* 이 조합에서 겹치는 작용 특성. 계열 구분은 아이콘 모양으로만 한다 — 색은 심각도 전용. */
function mechPanel(res) {
  const prof = res.prof || {};
  const hit = [], solo = [];
  MECH_FAMILIES.forEach(function (F) {
    MECHANISMS.filter(function (M) { return M.fam === F.id; }).forEach(function (M) {
      const es = prof[M.id]; if (!es) return;
      const entries = uniqItems(es);
      const items = entries.map(function (e) { return e.item; });
      /* 항목마다 근거 수준을 따로 붙인다. 이걸 빼면 「확립」 성분과 「이론적」 성분이
         한 줄에 나란히 놓여, 근거가 약한 쪽까지 같은 무게로 읽힌다.
         (예: 최기형성 행에서 이소트레티노인=확립 과 종합비타민의 비타민A=제한적) */
      const row = '<div class="mp-row' + (items.length >= 2 ? ' hit' : '') + '">' +
        '<div class="mp-head">' + ico(F.icon, 'fx-ico sm') +
          '<span>' + M.plain + ' <span class="mp-term">(' + M.term + ')</span></span>' +
          '<span class="mp-n num">' + items.length + '개</span>' +
        '</div>' +
        '<div class="mp-items">' + entries.map(function (e) {
          return '<span class="mp-item">' + itemLabel(e.item) +
                 '<span class="mp-ev">' + EVIDENCE[e.ev].label + '</span></span>';
        }).join('') + '</div>' +
        /* derive:'none' 은 조치 카드를 만들지 않는다. 조치 없이 위험 이름만 크게 남으면
           사용자가 스스로 끊는 판단을 할 수 있어, 무엇을 해야 하는지 한 줄을 반드시 붙인다. */
        (M.derive === 'none'
          ? '<div class="mp-note">이 특성은 해당되는 상황(임신·간·신장 기능 등)에서만 문제가 됩니다. ' +
            '스스로 판단해 끊지 마시고, 해당되신다면 이 목록을 진료 때 그대로 보여 주세요.</div>'
          : '') +
      '</div>';
      (items.length >= 2 ? hit : solo).push(row);
    });
  });

  const body = hit.length
    ? hit.join('')
    : '<div class="fx-col gap-sm">' +
        '<div class="t-emph">겹치는 작용 특성이 확인되지 않았습니다.</div>' +
        '<div class="fx-cap16">이 목록에 없다는 것이, 서로 영향이 없다는 뜻은 아닙니다. ' +
        '아래 「무엇을 확인하지 못했나요」를 꼭 읽어 주세요.</div>' +
      '</div>';

  const soloBlock = solo.length
    ? '<details class="fold" style="margin-top:12px"><summary>지금은 겹치지 않는 작용 특성 ' + solo.length + '가지</summary>' +
        '<div class="fold-body">' + solo.join('') +
        '<div class="fx-cap" style="margin-top:8px">지금은 항목이 하나뿐이라 겹치지 않습니다. 약이 하나 늘면 여기가 먼저 걸립니다.</div>' +
      '</div></details>'
    : '';

  return '<div class="section-title">이 조합에서 겹치는 작용 특성</div>' +
    '<div class="card fx-col">' + body + soloBlock + mechMap(res) +
      '<div class="mp-stamp">성분·작용 특성 매핑은 <b>검수 전 예시 데이터</b>입니다. 약사 검수 후 확정됩니다.</div>' +
    '</div>';
}

/* 성분 지도 — 항목명이 실리므로 리포트 본문 전용. 공유 카드에 넣지 않는다. */
function mechMap(res) {
  const prof = res.prof || {};
  const items = realRx().concat(state.supps);
  if (!items.length) return '';
  const cols = Object.keys(prof).map(function (id) {
    return { id: id, M: mechOf(id), n: uniqItems(prof[id]).length };
  }).filter(function (c) { return !!c.M; })
    .sort(function (a, b) { return b.n - a.n; })
    .slice(0, 6);
  if (!cols.length) return '';

  const head = '<tr><th class="colh"></th>' + cols.map(function (c) {
    return '<th class="colh' + (c.n >= 2 ? ' hit' : '') + '">' + c.M.term + '</th>';
  }).join('') + '</tr>';

  const body = items.map(function (it) {
    return '<tr><th class="rowh">' + itemLabel(it) + '</th>' + cols.map(function (c) {
      const es = prof[c.id].filter(function (e) { return e.item === it; });
      const cell = es.length
        ? '<span class="mx-dot' + (es.every(function (e) { return e.dir < 0; }) ? ' rev' : '') + '"></span>'
        : '';
      return '<td class="' + (c.n >= 2 ? 'hit' : '') + '">' + cell + '</td>';
    }).join('') + '</tr>';
  }).join('');

  return '<details class="fold" style="margin-top:12px"><summary>성분별로 보기</summary>' +
    '<div class="fold-body">' +
      '<div class="mx-wrap"><table class="mx-grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="mx-legend">● 그 작용 특성을 가진 항목 · ○ 반대 방향으로 작용하는 항목. ' +
      '점이 둘 이상인 열이 「겹치는 것」입니다.</div>' +
    '</div></details>';
}

/* ---------- 커버리지 ---------- */
const COV_SEEN = [
  '고르신 항목의 대표 성분 목록',
  '각 성분의 알려진 작용 특성',
  '항목 사이에 적용되는 상호작용 규칙'
];
function coverageMissing(res) {
  const prof = (res && res.prof) || {};
  const miss = [
    '하루에 얼마나 드시는지(용량)',
    '실제로 몇 시에, 몇 시간 간격으로 드시는지',
    '같은 이름이라도 제품마다 다른 함량',
    '진단받으신 질환 전체',
    '간·신장 기능 수치',
    '사람마다 다른 대사 능력(유전적 차이)'
  ];
  /* 아래는 「이 사람 조합을 실제로 읽었다」는 신호다 — 조합에 따라 붙는다. */
  if (prof.cyp) miss.push('간의 분해 효소는 사람마다 활성이 크게 다릅니다(CYP2C19·CYP2D6 유전 다형성). 같은 조합도 사람에 따라 결과가 달라집니다.');
  if (prof.chelate || prof.gastricph) miss.push('지금 실제로 몇 시간 간격을 두고 드시는지는 반영하지 않았습니다.');
  if (prof.bleed) miss.push('평소 멍이 잘 드는지, 수술·시술·발치 예정이 있는지는 반영하지 않았습니다.');
  if (prof.fatload) miss.push('각 제품에 든 실제 함량과, 식사로 드시는 양은 반영하지 않았습니다.');
  if (realConds().length === 0) miss.push('기저질환을 「해당 없음」으로 두셨습니다. 진단받으신 것이 있으면 결과가 달라집니다.');
  if (state.customs.length) miss.push('직접 입력하신 항목: <b>' + state.customs.map(esc).join(' · ') + '</b>');
  miss.push('이 리포트가 대조한 성분은 <b>' + ingredientCount() + '개</b>입니다. 실제 제품에는 이 목록에 없는 성분도 들어 있습니다.');
  return miss;
}

function coverageSection(res, missing) {
  const total = COV_SEEN.length + missing.length;
  let meter = '';
  for (let i = 0; i < total; i++) meter += '<i class="' + (i < COV_SEEN.length ? 'on' : '') + '"></i>';
  const item = function (html) {
    return '<div class="cov-item">' + ico('i-alert-circle', 'fx-ico sm') + '<span class="grow">' + html + '</span></div>';
  };
  return '<div class="section-title wf-anchor" id="notchecked">무엇을 확인하지 못했나요</div>' +
    '<div class="card fx-col gap-sm">' +
      '<div class="cov-meter">' + meter + '</div>' +
      '<div class="t-emph"><span class="num">' + total + '</span>가지 중 <span class="num">' + COV_SEEN.length + '</span>가지만 봤습니다</div>' +
      '<div class="fx-cap">칸 수는 목록의 개수일 뿐, 정확도 비율이 아닙니다.</div>' +
      '<div class="cov-sub">본 것</div>' +
      '<div class="cov-list">' + COV_SEEN.map(item).join('') + '</div>' +
      '<div class="cov-sub">보지 못한 것</div>' +
      '<div class="cov-list">' + missing.map(item).join('') + '</div>' +
    '</div>';
}

/* 근거 수준은 위험도와 독립된 축이다. 마지막 한 줄을 반드시 남긴다. */
function evLegend() {
  const rows = ['established', 'limited', 'theoretical'].map(function (key) {
    const E = EVIDENCE[key];
    return '<div class="ev-row">' + evBar(key).replace('<em>근거 ' + E.label + '</em>', '') +
      '<b>' + E.label + '</b><span>' + E.desc + '</span></div>';
  }).join('');
  return '<div class="card fx-col gap-sm">' +
    '<div class="mt-eyebrow">EVIDENCE</div>' +
    '<div class="ev-legend">' + rows + '</div>' +
    '<div class="fx-cap">근거 수준은 이 상호작용이 얼마나 잘 알려졌는지를 말합니다. 얼마나 위험한지를 말하지 않습니다.</div>' +
  '</div>';
}

/* 회의록 §7 의 분석 흐름을 사용자가 읽을 수 있는 형태로 옮긴 블록.
   「AI 가 자유롭게 판단하는 것이 아니라 데이터 + 규칙 → 결과 → 표현」. */
function methodBox(res, m, k) {
  const now = new Date();
  const p = function (n) { return (n < 10 ? '0' : '') + n; };
  const stamp = now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) +
                ' ' + p(now.getHours()) + ':' + p(now.getMinutes());
  const steps = [
    '고르신 항목 ' + m + '개를 확인했습니다',
    '각 항목의 대표 성분 ' + ingredientCount() + '개를 펼쳤습니다',
    '각 성분의 알려진 작용 특성 ' + mechCount() + '가지를 확인했습니다',
    '성분 사이에 적용되는 규칙 ' + ruleCount() + '개를 대조했습니다',
    '위험 수준을 매기고 문장으로 옮겼습니다'
  ].map(function (t, i) {
    return '<div class="mt-step"><b>' + (i + 1) + '</b><span>' + t + '</span></div>';
  }).join('');

  return '<div class="mt-box">' +
    '<div class="mt-eyebrow">METHOD</div>' +
    '<div style="font-weight:700;color:var(--ink);margin-bottom:6px">이 결과는 어떻게 나왔나요</div>' +
    steps +
    '<div class="mt-note">이 순서는 조합마다 똑같습니다. 결과는 정해진 규칙에서 나오며, 매번 다르게 만들어 내지 않습니다.</div>' +
    '<dl class="mt-dl">' +
      '<dt>규칙셋</dt><dd>v0.3 · 검수 전</dd>' +
      '<dt>대조 쌍</dt><dd>' + k + '건</dd>' +
      '<dt>적용 규칙</dt><dd>' + res.nCurated + '건 / 자동 도출 ' + res.nDerived + '건</dd>' +
      '<dt>판정 시각</dt><dd>' + stamp + '</dd>' +
    '</dl>' +
    '<div class="mt-note">이 결과는 진단이 아닙니다. 규칙셋은 약사 검수 전 예시 데이터입니다.</div>' +
  '</div>';
}


/* ==========================================================================
   7.2 가족 — 밖으로 나가는 것은 데이터가 0인 초대장 한 장뿐이다
   ========================================================================== */

/* 지금 누구 것을 입력·조회하고 있는지 항상 보이게 한다. */
function ctxBar() {
  if (!state.activeId) return '';
  const mm = findMember(state.activeId); if (!mm) return '';
  return '<div class="fm-ctx">' + ico('i-users', 'fx-ico sm') +
    '<span class="fm-ctx-t">지금 입력 중 · <b>' + esc(mm.label) + '</b></span>' +

/* ---------- 판정 숫자 카운트업 ----------
   ⚠ 이 연출은 「숫자를 세는 것」이지 「좋은 결과를 축하하는 것」이 아니다.
     주의 0건 화면에서도 「확인하지 못한 것 N」이 같은 방식으로 올라간다 —
     0 쪽만 연출하면 그게 곧 안심 신호가 된다(P4).
   prefers-reduced-motion: reduce 면 굴리지 않고 최종값을 그대로 앉힌다. */
function reduceMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e) { return false; }
}
function countUp(el, ms, delay) {
  if (!el) return;
  const n = Number(el.textContent) || 0;
  el.textContent = String(n);
  /* 굴리지 않는 조건 넷.
     · reduce      — 사용자가 모션을 줄여 달라고 했다
     · n <= 1      — 굴릴 것이 없다
     · rAF 없음    — 굴릴 방법이 없다
     · document.hidden — 백그라운드 탭에서는 rAF 가 멈춘다. 그대로 두면 숫자가
       중간값에 얼어붙고, 탭을 열었을 때 실제보다 **작은** 건수가 떠 있게 된다.
       보는 사람이 없는 동안의 연출을 위해 틀린 숫자를 띄울 이유가 없다. */
  if (reduceMotion() || n <= 1 || !window.requestAnimationFrame || document.hidden) return;

  /* ⚠ 0 에서 시작하지 않는다. 「0가지 확인이 필요해요」가 한 프레임이라도 뜨면
     그 프레임이 곧 P4 위반(주의 없음 오독)이다. 1 에서 n 까지만 굴린다. */
  el.textContent = '1';
  let done = false;
  const finish = function () { if (!done) { done = true; el.textContent = String(n); } };
  /* 어떤 이유로든 프레임이 오지 않으면 최종값을 강제로 앉힌다 — 숫자가 작게 남는
     경우를 만들지 않는 것이 연출보다 우선이다. */
  const guard = setTimeout(finish, (delay || 0) + ms + 1200);
  setTimeout(function () {
    if (el.isConnected === false) { clearTimeout(guard); return; }
    let t0 = null;
    const tick = function (now) {
      if (done) return;
      if (el.isConnected === false) { clearTimeout(guard); return; }
      if (t0 === null) t0 = now;
      const p = Math.min(1, (now - t0) / ms);
      el.textContent = String(Math.max(1, Math.round(n * (1 - Math.pow(1 - p, 3)))));
      if (p < 1) requestAnimationFrame(tick);
      else { clearTimeout(guard); finish(); }
    };
    requestAnimationFrame(tick);
  }, delay || 0);
}

/* 리포트에 「막 도착했을 때」만 굴린다. 리포트 안에서의 재렌더(앱 안내·복사 실패
   안내)까지 다시 굴리면 이미 읽은 숫자가 0으로 되돌아가 버린다. */

/* '없어요'/'해당 없음' 은 나머지와 배타 (SPEC §3) */
function toggleExclusive(arr, id, noneId) {
  if (id === noneId) return has(arr, noneId) ? [] : [noneId];
  const next = arr.filter(function (x) { return x !== noneId; });
  return has(next, id) ? next.filter(function (x) { return x !== id; }) : next.concat([id]);
}

let analyzeToken = 0;
function startAnalyze() {
  const token = ++analyzeToken;
  state.step = 0;

  const stepAt = function (ms, n) {
    setTimeout(function () {
      if (token !== analyzeToken || state.screen !== 'analyzing') return;
      state.step = n;
      render();
    }, ms);
  };
  /* v2: 회의록 §7 의 분석 흐름 5단계를 그대로 보여준다. 2.2초 · 균등 간격. */
  stepAt(440, 1);
  stepAt(880, 2);
  stepAt(1320, 3);
  stepAt(1760, 4);
  setTimeout(function () {
    if (token !== analyzeToken || state.screen !== 'analyzing') return;
    /* 가족 구성원의 입력은 이 시점에 저장한다. 「나」의 입력은 저장하지 않는다. */
    if (state.activeId) {
      const mm = findMember(state.activeId);
      if (mm) { Object.assign(mm, currentData());
                mm.savedAt = new Date().toLocaleDateString('ko-KR'); saveMembers(); }
    }
    /* 분석 화면은 히스토리에서 리포트로 덮어쓴다. 리포트에서 뒤로가면
       분석이 다시 돌지 않고 곧장 이전(처방약+기본정보) 화면으로 돌아가야 하기 때문. */
    go('report', { replace: true });

}

/* 남에게 줄 링크는 「내 결과」가 아니라 「이 서비스」다.
   reportUrl() 의 해시에는 r=처방약 · s=건기식 · a=연령 · c=특이사항(임신·수유 포함)이
   그대로 인코딩돼 있어, 공개적으로 뿌리면 민감정보가 URL 로 새어 나간다.
   본인이 결과를 다시 열기 위한 용도(copyLink)와 공유 용도(copyServiceLink)를 분리한다. */
function copyText(text, okMsg, onFail) {
  const done = function () { toast(okMsg); };
  const fail = onFail || function () { /* 조용히 실패 */ };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function () { legacyCopy(text, done, fail); });
  } else {
    legacyCopy(text, done, fail);
  }
}
function copyServiceLink() { copyText(location.href.split('#')[0], '링크를 복사했습니다'); }
function copyLink() {
  const url = reportUrl();
  copyText(url, '복사했습니다', function () { state.copyFallback = url; render(); });
}
function legacyCopy(text, done, fail) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? done() : fail();
  } catch (e) { fail(); }
}

/* 첫 구성원 저장 직전 1회 동의. 저장이 아예 안 되는 브라우저면 물을 것이 없다. */

function resetState() {
  state.rx = []; state.supps = []; state.customs = []; state.age = null;
  state.conds = []; state.q = ''; state.ocrPick = OCR_DEMO.map(function (o) { return o.sure; });
}

const ACTIONS = {
  start:      function () { go('supp'); },
  back:       function () { history.back(); },
  'to-search':function () { go('search'); },
  'to-cam':   function () { go('cam'); },
  'to-ocr':   function () { go('ocr'); },
  'to-rx':    function () { go('rx'); },
  analyze:    function () { startAnalyze(); },
  restart:    function () { switchTo(null); resetState(); go('landing'); },
  'to-family':    function () { go('family'); },
  'add-member':   function (el) { const rel = el.dataset.rel; requireAck(function () { addMember(rel); }); },
  /* 입력이 없는 대상을 리포트로 보내면 한 번도 입력하지 않은 사람에게
     「확인된 주의 신호 없음」 판정을 띄우게 된다 — P4 가 가장 나쁘게 깨지는 자리다.
     비어 있으면 입력 화면으로 보낸다. */
  'open-member':  function (el) { switchTo(el.dataset.id); go(itemCount() ? 'report' : 'supp'); },
  'ctx-mine':     function () { switchTo(null); go(itemCount() ? 'report' : 'supp'); },
  'demo-locked':  function () { toast('화면 설명용 예시라 열 수 없어요'); },
  'del-member':   function (el) {
    const id = el.dataset.id, m = findMember(id);
    if (!m) return;
    /* 보고 있던 구성원을 지우면 그 데이터가 화면에 남아 「나」로 오인될 수 있다.
       반드시 「나」로 되돌린 뒤 제거한다(wipeAll 과 같은 이유). */
    if (state.activeId === id) {
      state.activeId = null;
      loadData(mineSnapshot || { rx: [], supps: [], age: null, conds: [], customs: [] });
    }
    state.members = state.members.filter(function (x) { return x.id !== id; });
    saveMembers(); toast(m.label + ' 정보를 지웠습니다'); render();
  },
  'wipe-all':     function () { wipeAll(); },
  'open-invite':  function (el) { openInvite(el.dataset.target); },
  'inv-tab':      function (el) { openInvite(el.dataset.target); },
  'pick-msg':     function (el) {
    const pick = msgOf(state.invite.target, el.dataset.id);
    if (!pick) return;
    state.invite.msgId = pick.id; state.invite.text = pick.t; render();
  },
  'send-invite':  function () { sendInvite(); },
  'copy-invite':  function () { copyText(state.invite.text + '\n' + inviteUrl(), '복사했습니다'); },
  'copy-invite-link': function () { copyText(inviteUrl(), '링크를 복사했습니다'); },
  /* 동의 → 시트를 닫고(뒤로가기) 나서 원래 하려던 일을 이어서 한다.
     history.back() 은 비동기라, next() 를 여기서 바로 부르면 뒤이어 도착한
     popstate 가 화면을 동의 시트 직전으로 되돌려 버린다. popstate 뒤에 실행한다. */
  'ack-store':    function () {
    state.storeAck = true; storeSet(KEY_A, '1');
    runAfterPop = pendingAfterAck; pendingAfterAck = null;
    history.back();
    /* pushState 가 막힌 환경(file://)에서는 popstate 가 오지 않는다 — 그때의 보루. */
    setTimeout(function () {
      if (!runAfterPop) return;
      const n = runAfterPop; runAfterPop = null;
      state.sheet = null; render(); n();
    }, 400);
  },
  'big-text':     function () {
    state.bigText = !state.bigText;
    document.documentElement.classList.toggle('big-text', state.bigText);
    render();
  },
  'share-card': function () {
    toast('이 카드를 캡처해 공유해주세요');
    /* url 은 서비스 주소만 넘긴다. reportUrl() 을 넘기면 약 목록·특이사항이 링크에 실린다. */
    if (navigator.share) {
      navigator.share({
        title: '모두의 복약',
        text: '내가 먹는 약이랑 영양제 조합, 1분이면 확인돼요',
        url: location.href.split('#')[0]
      }).catch(function () {});
    }
  },

  'rx-toggle': function (el) {
    state.rx = toggleExclusive(state.rx, el.dataset.id, 'none');
    render();
  },
  'supp-toggle': function (el) {
    const id = el.dataset.id;
    state.supps = has(state.supps, id)
      ? state.supps.filter(function (x) { return x !== id; })
      : state.supps.concat([id]);
    render();
  },
  age:  function (el) { state.age = el.dataset.id; render(); },
  cond: function (el) { state.conds = toggleExclusive(state.conds, el.dataset.id, 'none'); render(); },

  'open-custom':  function () { go('supp', { sheet: 'custom', keepScroll: true }); },
  'close-sheet':  function () { history.back(); },
  'del-custom':   function (el) { state.customs.splice(Number(el.dataset.i), 1); render(); },

  'pick-drug': function (el) {
    const d = DRUG_SEARCH[Number(el.dataset.i)];
    if (!has(state.rx, d.rx)) state.rx = toggleExclusive(state.rx, d.rx, 'none');
    toast(d.name + ' → ' + rxName(d.rx) + '으로 담았습니다');
    render();
  },
  'ocr-toggle': function (el) {
    const i = Number(el.dataset.i);
    state.ocrPick[i] = !state.ocrPick[i];
    render();
  },
  'ocr-confirm': function () {
    OCR_DEMO.forEach(function (o, i) {
      if (state.ocrPick[i] && !has(state.rx, o.rx)) state.rx = toggleExclusive(state.rx, o.rx, 'none');
    });
    const n = state.ocrPick.filter(Boolean).length;
    go('rx');
    toast(n + '개를 담았습니다');
  },

  scrollto: function (el) {
    const t = document.getElementById(el.dataset.target);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  'app-soon':  function () { state.appNotice = true; render(); },
  'copy-link': function () { copyLink(); },
  'copy-service-link': function () { copyServiceLink(); }
};

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'FORM') return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el);
});

document.addEventListener('submit', function (e) {
  const el = e.target.closest('[data-act="add-custom"]');
  if (!el) return;
  e.preventDefault();
  const input = document.getElementById('custom-input');
  const v = (input.value || '').trim();
  if (!v) return;
  if (state.customs.length >= 8) { toast('여덟 개까지 적으실 수 있어요'); return; }
  state.customs.push(v);
  render();
});

/* 검색은 결과 영역만 다시 그린다. 화면 전체를 다시 그리면 입력 포커스가 튄다. */
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') {
    state.q = e.target.value;
    const box = document.getElementById('search-results');
    if (box) box.innerHTML = searchResults();
    return;
  }
  /* render() 는 innerHTML 을 통째로 다시 그리므로 여기서 부르면 입력 중이던 값이 날아간다. */
  if (e.target.id === 'invite-text' && state.invite) { state.invite.text = e.target.value; }
});


/* ==========================================================================
   10. 진입 — 해시가 있으면 랜딩을 건너뛰고 바로 리포트 (SPEC §7)
   ========================================================================== */
state.members  = loadMembers();
state.storeAck = storeGet(KEY_A) === '1';
/* 초대로 들어왔는지. 부울 하나뿐이라 개인정보가 아니다. */
state.fromInvite = /(^|[#&])invite=1(&|$)/.test(location.hash);

const parsed = parseHash();
if (parsed) { applyParsed(parsed); state.screen = 'report'; state.activeId = null; }
else if (state.fromInvite) {
  /* 수신자가 50~70대일 확률이 높다 — 글자를 처음부터 키워 둔다. */
  state.screen = 'landing'; state.bigText = true;
  document.documentElement.classList.add('big-text');
}
try { history.replaceState({ screen: state.screen, sheet: null }, '', location.href); } catch (e) { /* file:// 대비 */ }
render();

})();
</script>
</body>
</html>
