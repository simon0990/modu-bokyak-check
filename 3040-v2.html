<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>1분 복용 위험 분석 — 모두의 복약 (검수 전 프로토타입)</title>
<!-- 1×1 투명 PNG. 브라우저가 /favicon.ico 를 자동으로 요청하는 것까지 막아 요청 0건을 지킨다.
     (data:, 처럼 빈 URI 를 주면 크롬이 무효로 보고 /favicon.ico 를 그대로 때린다) -->
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
<style>
/* ==========================================================================
   3040 변형 v2 — 라이트 단일 테마. 의료 신뢰 관습을 따른다.
   v1 의 다크 + 보라 그라데이션 + 컬러 글로우는 전부 폐기했다.
   색은 「심각도 전용 채널」로 남긴다 — 브랜드·관계·계열 구분에 색을 쓰지 않는다.
   hue 70°–170°(초록·연두·민트·틸) 는 이 파일에 하나도 정의하지 않는다.
   「주의 0건」이 가장 흔한 결과라, 초록 한 점이 「다 괜찮다」로 읽히기 때문이다.
   ========================================================================== */
:root {
  /* ---- 표면·잉크 ---- */
  --bg:           #F4F6F9;
  --surface:      #FFFFFF;
  --surface-sunk: #EFF2F6;
  --line:         #E3E8EF;
  --line-ctrl:    #C6CEDA;
  --line-strong:  #8A94A6;

  --ink:   #101828;
  --ink-2: #475467;
  --ink-3: #616B7D;
  --ink-4: #6C7688;
  --ink-5: #98A2B3;

  /* ---- 브랜드: 잉크 네이비 ---- */
  --brand-900: #16233F;
  --brand-700: #1F3461;
  --brand-600: #27437C;
  --brand-500: #3A5DA8;
  --brand-100: #E6EDF9;
  --brand-50:  #F2F6FC;

  /* ---- 심각도 4등급 ---- */
  --sev-warn:  #B42318; --sev-warn-bg:  #FEF3F2; --sev-warn-line: #FDA29B; --sev-warn-mark: #D92D20;
  --sev-time:  #B54708; --sev-time-bg:  #FFFAEB; --sev-time-line: #FEC84B; --sev-time-mark: #DC6803;
  --sev-check: #175CD3; --sev-check-bg: #EFF6FF; --sev-check-line:#B2DDFF; --sev-check-mark:#1570EF;
  --sev-info:  #475467; --sev-info-bg:  #F8F9FB; --sev-info-line: #D0D5DD; --sev-info-mark: #98A2B3;

  --demo: #7A2E0E; --demo-bg: #FEF0C7; --demo-line: #F79009;
  --focus: #1F3461; --focus-halo: rgba(31,52,97,.20);

  /* 토큰 정의 한 줄만 유지한다. 화면 어디에서도 참조하지 않는다. */
  --success-green: #36B37E;

  /* ---- 공유 카드 다크 아일랜드 ---- */
  --card-ink-1: #0B1020; --card-ink-2: #131A2E;
  --card-fg: #F2F4F7;   --card-mut: #A6B0C0;
  --card-line: rgba(255,255,255,.11);
  --card-warn: #FDA29B; --card-time: #FEC84B; --card-check: #84CAFF;

  /* ---- 폰트 ---- */
  --font-ui:  'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;

  /* ---- 간격 ---- */
  --s-05:2px; --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px;

  /* ---- 라운드 ---- */
  --r-2:2px; --r-6:6px; --r-8:8px; --r-10:10px; --r-14:14px;
  --r-18:18px; --r-24:24px; --r-28:28px; --r-pill:999px;

  /* ---- 그림자 (검정 틴트만) ---- */
  --sh-1: 0 1px 2px rgba(16,24,40,.06);
  --sh-2: 0 1px 3px rgba(16,24,40,.07), 0 1px 2px -1px rgba(16,24,40,.06);
  --sh-3: 0 4px 8px -2px rgba(16,24,40,.07), 0 2px 4px -2px rgba(16,24,40,.05);
  --sh-4: 0 12px 16px -4px rgba(16,24,40,.08), 0 4px 6px -2px rgba(16,24,40,.04);
  --sh-5: 0 24px 32px -8px rgba(16,24,40,.12), 0 8px 12px -6px rgba(16,24,40,.06);
  --sh-btn: 0 1px 2px rgba(16,24,40,.10),
            inset 0 1px 0 rgba(255,255,255,.14),
            inset 0 -1px 0 rgba(0,0,0,.16);
  --sh-focus: 0 0 0 3px var(--focus-halo);

  /* ---- 모션 ---- */
  --d-1:120ms; --d-2:180ms; --d-3:260ms; --d-4:420ms;
  --e-out: cubic-bezier(.16,1,.3,1);
  --e-io:  cubic-bezier(.65,0,.35,1);
  --e-snap:cubic-bezier(.34,1.4,.64,1);

  --min-touch: 48px;
  --demo-strip-h: 36px;
}

/* ==========================================================================
   베이스
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink-2);
  font-family:var(--font-ui); font-size:16px; font-weight:400; line-height:1.68;
  letter-spacing:0; word-break:keep-all; overflow-wrap:break-word; text-wrap:pretty;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-synthesis-weight:none;
}
button{font:inherit;color:inherit}
svg{display:block}
.app{
  max-width:430px; margin:0 auto; background:var(--bg);
  min-height:calc(100vh - var(--demo-strip-h));
  min-height:calc(100dvh - var(--demo-strip-h));
  display:flex; flex-direction:column;
}
@media (min-width:486px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:var(--sh-2)}
}
.screen-body{flex:1;padding:var(--s-5);display:flex;flex-direction:column;min-width:0}
.screen-body.no-pad{padding:0}

:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:inherit}
.big-btn:focus-visible,.chip:focus-visible,.wf-tile:focus-visible,.row-card:focus-visible,
.fm-slot:focus-visible,.fm-row:focus-visible{box-shadow:var(--sh-focus)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    /* 지연까지 0 으로 내려야 한다. fill-mode:both 인 스태거는 duration 만 줄이면
       delay 동안 from 상태(opacity:0)로 멈춰 있어 글자가 사라진 것처럼 보인다. */
    animation-delay:0ms!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
}

.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

html.big-text{font-size:118%}
html.big-text .fx-cap{font-size:15px}

/* ==========================================================================
   타입 스케일 — 굵기는 400 과 700 둘뿐 (Malgun Gothic 은 그 둘만 가진다)
   ========================================================================== */
.t-body{font-size:16px;line-height:1.68}
.t-emph{font-size:18px;font-weight:700;color:var(--ink)}
.t-title{font-size:24px;font-weight:700;line-height:1.38;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
.t-secondary{color:var(--ink-3)}
.t-blue{color:var(--brand-600)}
.bold{font-weight:700}
.stack{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.gap-xs{gap:var(--s-1)} .gap-sm{gap:var(--s-2)}
.gap-md{gap:var(--s-4)} .gap-lg{gap:var(--s-6)}

.section-title{
  font-size:20px;font-weight:700;line-height:1.42;letter-spacing:-.01em;color:var(--ink);
  margin:var(--s-8) 0 var(--s-2);flex:none;scroll-margin-top:56px;text-wrap:balance;
}
.section-title.first{margin-top:0}

.fx-ico{width:24px;height:24px;flex:none}
.fx-ico.sm{width:18px;height:18px}
.fx-ico.lg{width:28px;height:28px}
.fx-ico.xl{width:28px;height:28px}

.fx-col{display:flex;flex-direction:column;flex:none;min-width:0}
.fx-row{display:flex;align-items:center;flex:none;min-width:0;flex-wrap:wrap;row-gap:var(--s-1)}
.fx-row.top{align-items:flex-start;flex-wrap:nowrap}
.fx-center{text-align:center}
.fx-cap{font-size:13px;line-height:1.6;color:var(--ink-3)}
.fx-cap16{font-size:14px;line-height:1.64;color:var(--ink-3)}
.fx-link{font-size:14px;font-weight:700;color:var(--brand-600);flex:none}
.fx-divider{height:1px;background:var(--line);flex:none;margin:var(--s-5) 0}
.fx-lead{font-size:18px;line-height:1.62;letter-spacing:-.005em;color:var(--ink)}
.fx-spacer{flex:1;min-height:var(--s-4)}

.fx-pill{
  position:relative;flex:none;width:26px;height:26px;border-radius:var(--r-pill);
  background:var(--surface-sunk);border:1.5px solid var(--line-ctrl);
}
.fx-pill.oval{width:34px;height:22px;border-radius:var(--r-pill)}
.fx-pill.score::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:56%;height:2px;background:var(--line-ctrl);
}

.fx-strip{display:flex;align-items:stretch;flex:none}
.fx-strip>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-1)}
.fx-strip>div+div{border-left:1px solid var(--line)}
.fx-strip b{font-family:var(--font-num);font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.fx-strip span{font-size:12px;color:var(--ink-3);font-weight:400}

.fx-chips{display:flex;flex-wrap:wrap;gap:var(--s-2);flex:none}
.fx-chips.tight{gap:var(--s-2)}

/* ==========================================================================
   데모 띠 — 제거·약화 금지
   ========================================================================== */
.demo-strip{
  position:sticky;top:0;z-index:200;min-height:var(--demo-strip-h);
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--demo-bg);color:var(--demo);border-bottom:1px solid var(--demo-line);
  font-size:12px;font-weight:700;line-height:1.45;padding:7px 14px;text-align:center;
}
.demo-strip svg{width:14px;height:14px;flex:none}

/* ==========================================================================
   버튼 / 칩 / 행 카드
   ========================================================================== */
.big-btn{
  min-height:52px;width:100%;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  padding:0 var(--s-5);border:1px solid transparent;border-radius:var(--r-14);
  font-family:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;cursor:pointer;
  transition:background-color var(--d-2) var(--e-out),border-color var(--d-2) var(--e-out),
             box-shadow var(--d-2) var(--e-out),transform var(--d-1) var(--e-out);
}
.big-btn.primary{background:var(--brand-700);color:#fff;box-shadow:var(--sh-btn)}
.big-btn.primary:hover{background:var(--brand-600)}
.big-btn.primary:active{transform:scale(.985);box-shadow:var(--sh-1)}
.big-btn.secondary{background:var(--surface);color:var(--brand-600);border-color:var(--line-ctrl);box-shadow:var(--sh-1)}
.big-btn.secondary:hover{background:var(--brand-50);border-color:var(--brand-500)}
.big-btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.big-btn.ghost:hover{background:var(--surface-sunk)}
.big-btn.sm{min-height:40px;font-size:15px;border-radius:var(--r-10);padding:0 var(--s-3);width:auto}
.big-btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}

.chip{
  min-height:44px;display:inline-flex;align-items:center;gap:var(--s-1);padding:0 var(--s-4);
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-ctrl);
  border-radius:var(--r-pill);font-family:inherit;font-size:16px;font-weight:400;cursor:pointer;
  transition:background-color var(--d-2) var(--e-out),border-color var(--d-2) var(--e-out),
             color var(--d-2) var(--e-out),transform var(--d-1) var(--e-snap);
}
.chip:hover{border-color:var(--line-strong);background:var(--brand-50)}
.chip.selected{background:var(--brand-100);border-color:var(--brand-500);color:var(--brand-600);font-weight:700}
.chip.selected:active{transform:scale(.96)}
.chip.sm{min-height:38px;font-size:14px;padding:0 var(--s-3)}
.chip.wf{min-height:44px;font-size:16px;padding:0 var(--s-4)}

.row-card{
  display:flex;align-items:center;gap:var(--s-3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-14);
  padding:var(--s-4);flex:none;width:100%;text-align:left;font-family:inherit;color:inherit;
  box-shadow:var(--sh-1);
  transition:border-color var(--d-2) var(--e-out),background-color var(--d-2) var(--e-out);
}
button.row-card{cursor:pointer}
button.row-card:hover{border-color:var(--brand-500);background:var(--brand-50)}

.icon-box{
  width:40px;height:40px;border-radius:var(--r-10);
  background:var(--brand-50);border:1px solid var(--brand-100);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--brand-600);
}
.icon-box.lg{width:44px;height:44px;border-radius:var(--r-14)}
.icon-box.orange{background:var(--sev-time-bg);border-color:var(--sev-time-line);color:var(--sev-time)}
.icon-box.purple{background:var(--surface-sunk);border-color:var(--line);color:var(--ink-2)}

/* 칩=인터랙티브=pill, 배지=정보=r-6. 형태로 눌리는 것과 아닌 것을 가른다. */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-6);
     font-size:12px;font-weight:700;line-height:1.4;flex:none}
.tag.rx{background:var(--brand-50);color:var(--brand-600)}
.tag.suppl{background:var(--surface-sunk);color:var(--ink-2)}
.tag.gray{background:var(--surface-sunk);color:var(--ink-3)}
.tag.warn{background:var(--sev-warn-bg);color:var(--sev-warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-18);
      padding:var(--s-5);box-shadow:var(--sh-1);flex:none}
.card.elevated{box-shadow:var(--sh-3)}

.footer-bar{flex:none;padding:var(--s-4) var(--s-5) calc(var(--s-5) + env(safe-area-inset-bottom));
            background:var(--surface);border-top:1px solid var(--line)}

.input{
  background:var(--surface);border:1px solid var(--line-ctrl);border-radius:var(--r-10);
  font-size:16px;font-family:inherit;color:var(--ink);padding:12px 14px;width:100%;
}
.input::placeholder{color:var(--ink-3)}

.warn-banner{
  display:flex;gap:var(--s-2);align-items:flex-start;
  background:var(--sev-warn-bg);border:1px solid var(--sev-warn-line);border-radius:var(--r-14);
  padding:var(--s-4);color:var(--sev-warn);font-size:15px;line-height:1.6;flex:none;
}
.warn-banner svg{flex:none;margin-top:2px}
.warn-banner.info{background:var(--sev-check-bg);border-color:var(--sev-check-line);color:var(--sev-check)}
.warn-banner.caution{background:var(--sev-time-bg);border-color:var(--sev-time-line);color:var(--sev-time)}

/* ==========================================================================
   화면 헤더 / 진행 표시
   ========================================================================== */
.screen-header{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);padding:var(--s-2) var(--s-3) var(--s-3);
  border-bottom:1px solid var(--line);position:sticky;top:var(--demo-strip-h);z-index:30;
}
.screen-header .sh-side{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;color:var(--ink-2)}
.screen-header .sh-title{
  flex:1;text-align:center;font-size:18px;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.wf-steps{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.wf-steps .s{height:5px;flex:1 1 0;min-width:20px;border-radius:var(--r-pill);background:var(--line)}
.wf-steps .s.on{background:var(--brand-600)}
.wf-steps .s.done{background:var(--brand-500)}
.wf-steplabel{font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--ink-3);flex:none}

/* ==========================================================================
   히어로 / 신뢰 3칸
   ========================================================================== */
/* 세로 여백을 32 → 24 로 줄였다. 랜딩 첫 화면에 결과 미리보기(.lp)가 들어오면서
   375×812 에서 CTA 가 접히지 않게 하려면 히어로에서 16px 을 내줘야 한다. */
.wf-hero{flex:none;background:var(--brand-900);border-radius:var(--r-24);padding:var(--s-6) var(--s-5);
         display:flex;flex-direction:column;gap:var(--s-3)}
.h-eyebrow{font-size:13px;font-weight:700;color:#8FB3E8;letter-spacing:0}
.h-title{font-size:30px;font-weight:700;line-height:1.30;letter-spacing:-.02em;color:#F2F6FC;text-wrap:balance}
.h-sub{font-size:15px;line-height:1.7;color:#A9B6D0}

.wf-trust{display:flex;gap:var(--s-2);flex:none}
.wf-trust>div{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-14);
  padding:var(--s-3) var(--s-1);display:flex;flex-direction:column;align-items:center;gap:var(--s-1);
  text-align:center;box-shadow:var(--sh-1);
}
.wf-trust svg{color:var(--brand-600)}
.wf-trust b{font-size:14px;font-weight:700;color:var(--ink)}
.wf-trust span{font-size:12px;color:var(--ink-3);font-weight:400;line-height:1.45}

/* ==========================================================================
   랜딩 결과 미리보기 — 「1분 뒤 이런 걸 받아요」
   시작할 이유를 만드는 자리다. 다만 **이건 예시이지 사용자의 결과가 아니다.**
   그래서 (1) 프레임 안에 「예시 화면」 라벨을 박고, (2) 아래쪽 기전 행을
   블러 + 마스크로 흐려 「읽는 것」이 아니라 「생김새」로만 보이게 한다.
   ========================================================================== */
.lp{flex:none;display:flex;flex-direction:column;gap:var(--s-2)}
.lp-head{display:flex;align-items:baseline;gap:var(--s-2)}
.lp-head b{font-size:15px;font-weight:700;color:var(--ink);flex:none}
.lp-head span{font-size:12px;color:var(--ink-3);line-height:1.5;min-width:0}
.lp-frame{
  position:relative;overflow:hidden;height:196px;
  border:1px solid var(--line);border-radius:var(--r-18);
  background:var(--surface);box-shadow:var(--sh-2);
}
.lp-stage{
  padding:10px;display:flex;flex-direction:column;gap:var(--s-2);
  -webkit-mask-image:linear-gradient(180deg,#000 0 66%,rgba(0,0,0,.34) 88%,rgba(0,0,0,0) 100%);
          mask-image:linear-gradient(180deg,#000 0 66%,rgba(0,0,0,.34) 88%,rgba(0,0,0,0) 100%);
}
.lp-type{
  background:linear-gradient(152deg,var(--tp-1) 0%,var(--tp-2) 100%);
  border-radius:var(--r-14);padding:10px var(--s-2);
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;
}
.lp-ico{width:30px;height:30px;border-radius:var(--r-pill);margin-bottom:2px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none}
.lp-ico svg{width:17px;height:17px}
.lp-t-cap{font-size:11px;font-weight:700;line-height:1.4;color:#CFC9E0}
.lp-t-name{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.25}
.lp-t-rare{font-size:11px;font-weight:700;line-height:1.4;color:#EDEAF6;margin-top:3px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-radius:var(--r-pill);padding:2px 9px}
/* 블러는 "읽히지 않게" 하는 장치다. 그래도 색 자체는 본문 규칙(--ink / 심각도 칩)을
   그대로 써서, 흐림을 걷어내도 대비가 모자라는 조합이 화면에 없게 한다. */
.lp-rows{display:flex;flex-direction:column;gap:6px;filter:blur(2.4px)}
.lp-row{display:flex;align-items:center;gap:var(--s-2);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-10);padding:8px 10px}
.lp-chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--r-6);flex:none}
.lp-chip.t{background:var(--sev-time-bg);color:var(--sev-time)}
.lp-chip.c{background:var(--sev-check-bg);color:var(--sev-check)}
.lp-txt{font-size:12px;line-height:1.4;color:var(--ink);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-mark{
  position:absolute;right:10px;bottom:10px;z-index:2;
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-ctrl);
  border-radius:var(--r-pill);padding:4px 11px;box-shadow:var(--sh-1);
}

/* ==========================================================================
   영양제 타일 — 이모지 없음, 텍스트만
   ========================================================================== */
.wf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2);flex:none}
.wf-tile{
  position:relative;min-height:72px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:var(--s-3) var(--s-2);
  background:var(--surface);border:1px solid var(--line-ctrl);border-radius:var(--r-14);
  box-shadow:var(--sh-1);font-family:inherit;cursor:pointer;
  transition:border-color var(--d-2) var(--e-out),background-color var(--d-2) var(--e-out),
             box-shadow var(--d-2) var(--e-out),transform var(--d-1) var(--e-out);
}
.wf-tile .t-name{font-size:16px;font-weight:400;color:var(--ink-2);line-height:1.35}
.wf-tile:hover{border-color:var(--brand-500);box-shadow:var(--sh-2)}
.wf-tile.on{background:var(--brand-50);border-color:var(--brand-500);box-shadow:var(--sh-2)}
.wf-tile.on .t-name{color:var(--brand-700);font-weight:700}
.wf-tile:active{transform:scale(.97)}
.wf-tile .t-check{
  position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:var(--r-pill);
  background:var(--brand-700);color:#fff;display:none;align-items:center;justify-content:center;
  animation:pop var(--d-2) var(--e-snap);
}
.wf-tile.on .t-check{display:flex}
.wf-tile .t-check svg{width:12px;height:12px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ==========================================================================
   하단 CTA 바
   ========================================================================== */
.wf-cta{
  flex:none;background:var(--surface);border-top:1px solid var(--line);
  padding:var(--s-3) var(--s-5) calc(var(--s-4) + env(safe-area-inset-bottom));
  position:sticky;bottom:0;z-index:40;box-shadow:0 -4px 12px rgba(16,24,40,.06);
}
.wf-cta .c-count{font-size:14px;color:var(--ink-3);margin-bottom:var(--s-2);
                 display:flex;align-items:center;gap:6px}
.wf-cta .c-count b{color:var(--brand-600);font-family:var(--font-num)}
.wf-cta .c-count svg{color:var(--brand-500)}

/* ==========================================================================
   분석 중
   ========================================================================== */
.wf-scan{width:128px;height:128px;margin:0 auto;flex:none;position:relative;
         display:flex;align-items:center;justify-content:center;color:var(--brand-600)}
.wf-scan .scan-ring{position:absolute;inset:0;width:100%;height:100%}
.wf-scan .scan-track{fill:none;stroke:var(--line);stroke-width:4}
.wf-scan .scan-sweep{fill:none;stroke:var(--brand-500);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:60 220;transform-origin:50% 50%;animation:sweep 1400ms linear infinite}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wf-lines{display:flex;flex-direction:column;gap:var(--s-2);flex:none}
.wf-line{display:flex;align-items:center;gap:var(--s-3);font-size:15px;line-height:1.55;color:var(--ink-3)}
.wf-line.done{color:var(--ink-2)}
.wf-line.now{color:var(--brand-700);font-weight:700}
.wf-line .l-dot{
  width:20px;height:20px;border-radius:var(--r-pill);flex:none;
  border:1.5px solid var(--line-ctrl);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
}
.wf-line.done .l-dot{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.wf-line.done .l-dot svg{width:12px;height:12px}
.wf-line.now .l-dot{border-color:var(--brand-500);border-width:3px}

/* ==========================================================================
   판정 블록 — 마크업의 「wf-verdict」 + 「clear」 클래스 순서는 절대 바꾸지 않는다
   (check.mjs 가 그 리터럴을 찾아 「주의 없음」 판정 근처의 초록을 검사한다)
   ========================================================================== */
.wf-verdict{flex:none;padding:var(--s-6) var(--s-5);border-radius:var(--r-24);
            display:flex;flex-direction:column;gap:var(--s-2)}
.wf-verdict .v-num,.wf-verdict .v-alt{
  font-family:var(--font-num);font-size:56px;font-weight:700;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.wf-verdict .v-label{font-size:20px;font-weight:700;line-height:1.4}
.wf-verdict .v-sub{font-size:14px;font-weight:400;line-height:1.64}
.wf-verdict .v-src{font-size:13px;color:var(--ink-3);font-family:var(--font-num)}
.wf-verdict.warn{background:var(--sev-warn-bg);border:1px solid var(--sev-warn-line)}
.wf-verdict.warn .v-num,.wf-verdict.warn .v-label{color:var(--sev-warn)}
.wf-verdict.warn .v-sub{color:#7A271A}
.wf-verdict.clear{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1)}
.wf-verdict.clear .v-num,.wf-verdict.clear .v-label{color:var(--ink)}
.wf-verdict.clear .v-sub{color:var(--ink-2)}
/* P4 를 색이 아니라 레이아웃으로 강제한다 — 눈이 「0」만 집어 갈 수 없게 */
.wf-verdict .v-pair{display:flex;gap:var(--s-6);align-items:baseline;flex-wrap:wrap}
.wf-verdict .v-pair>div{display:flex;flex-direction:column;gap:var(--s-1)}
.wf-verdict .v-alt{color:var(--sev-time)}
.wf-verdict .v-altlabel{font-size:14px;font-weight:700;color:var(--sev-time)}
.wf-verdict .v-jump{background:none;border:0;padding:0;text-align:left;cursor:pointer;
                    display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-1)}
.wf-verdict .v-jump .v-altlabel{text-decoration:underline;text-underline-offset:3px}

/* ==========================================================================
   finding — 한 흰 카드 안의 헤어라인 행
   ========================================================================== */
.findings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-18);
          box-shadow:var(--sh-1);overflow:hidden}
.wf-find{position:relative;padding:var(--s-4) var(--s-4) var(--s-4) var(--s-5);
         display:flex;flex-direction:column;gap:var(--s-2)}
.wf-find + .wf-find{border-top:1px solid var(--line)}
.wf-find::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--_mark)}
.wf-find.lv1{--_mark:var(--sev-warn-mark); --_fg:var(--sev-warn); --_bg:var(--sev-warn-bg)}
.wf-find.lv2{--_mark:var(--sev-time-mark); --_fg:var(--sev-time); --_bg:var(--sev-time-bg)}
.wf-find.lv3{--_mark:var(--sev-check-mark);--_fg:var(--sev-check);--_bg:var(--sev-check-bg)}
.wf-find.lv4{--_mark:var(--sev-info-mark); --_fg:var(--sev-info); --_bg:var(--sev-info-bg)}
.f-lv{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:3px 9px;
      border-radius:var(--r-6);background:var(--_bg);color:var(--_fg);font-size:12px;font-weight:700}
.f-lv svg{width:13px;height:13px}
.f-rule{font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.08em;
        text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wf-pair{font-size:16px;font-weight:700;color:var(--ink)}
.wf-pair .p-x{color:var(--ink-3);margin:0 6px;font-weight:400}
.f-what{font-size:16px;line-height:1.68;color:var(--ink-2)}
.f-what b{color:var(--ink);font-weight:700}
.f-do{display:flex;gap:var(--s-2);align-items:flex-start;background:var(--surface-sunk);
      border-radius:var(--r-10);padding:var(--s-3);font-size:15px;line-height:1.6;color:var(--ink)}
.f-do svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--brand-600)}
.f-meta{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.f-why{border-top:1px dashed var(--line);padding-top:var(--s-2)}
.f-why>summary{font-size:14px;font-weight:700;color:var(--brand-600);cursor:pointer;list-style:none}
.f-why>summary::-webkit-details-marker{display:none}
.f-why>summary::after{content:" \25B8";color:var(--ink-3)}
.f-why[open]>summary::after{content:" \25BE"}
.fw-detail{font-size:14px;line-height:1.7;color:var(--ink-2);margin:var(--s-2) 0 0}
.fw-via{font-size:13px;color:var(--ink-3);margin:var(--s-2) 0 0}
.f-stamp{font-size:11px;color:var(--ink-3);align-self:flex-end}

/* ==========================================================================
   기전 칩 / 근거 막대 — 전면 모노크롬. 색은 심각도 전용 채널로 남긴다
   ========================================================================== */
.mech-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-6);
           background:var(--surface-sunk);color:var(--ink-2);font-size:13px;font-weight:700}
.mech-chip svg{width:14px;height:14px;color:var(--ink-3)}
.mc-term{font-size:12px;font-weight:400;color:var(--ink-3);font-style:normal}
.ev-bar{display:inline-flex;align-items:center;gap:4px}
.ev-bar i{width:6px;height:3px;border-radius:var(--r-2);background:var(--line-ctrl);display:block}
.ev-bar i.on{background:var(--ink-3)}
.ev-bar em{font-size:12px;font-weight:400;color:var(--ink-3);font-style:normal;margin-left:2px}
.ev-legend{display:flex;flex-direction:column;gap:var(--s-2)}
.ev-legend .ev-row{display:flex;align-items:baseline;gap:var(--s-3);font-size:13px;color:var(--ink-2)}
.ev-legend .ev-row b{font-weight:700;color:var(--ink);flex:none;width:44px}

/* ==========================================================================
   기전 패널 / 성분 지도
   ========================================================================== */
.mp-row{display:flex;flex-direction:column;gap:var(--s-1);padding:var(--s-3) 0}
.mp-row + .mp-row{border-top:1px solid var(--line)}
.mp-row.hit{padding-left:var(--s-3);border-left:2px solid var(--ink-3)}
.mp-head{display:flex;align-items:center;gap:var(--s-2);font-size:15px;color:var(--ink-2)}
.mp-row.hit .mp-head{font-weight:700;color:var(--ink)}
.mp-head svg{width:18px;height:18px;flex:none;color:var(--ink-3)}
.mp-term{font-size:12px;font-weight:400;color:var(--ink-3)}
.mp-n{margin-left:auto;font-family:var(--font-num);font-size:13px;color:var(--ink-3);flex:none}
.mp-items{font-size:13px;color:var(--ink-3);padding-left:26px;display:flex;flex-wrap:wrap;gap:6px 10px}
.mp-item{display:inline-flex;align-items:center;gap:5px}
/* 근거 수준은 심각도가 아니므로 색을 쓰지 않는다 — 모노크롬 배지 */
/* 10px + --ink-4 는 명암비 4.08 로 AA(4.5) 미달이었다. 11px + --ink-2 로 올린다. */
.mp-ev{font-size:11px;font-weight:700;letter-spacing:.2px;color:var(--ink-2);
  background:var(--surface-sunk);border:1px solid var(--line);border-radius:var(--r-6);padding:1px 5px}
.mp-note{margin:6px 0 0 26px;font-size:12px;line-height:1.6;color:var(--ink-3);
  border-left:2px solid var(--line-ctrl);padding-left:9px}
.mp-stamp{margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--line);
  font-size:12px;line-height:1.6;color:var(--ink-3)}
.mp-fam{font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.08em;
        text-transform:uppercase;color:var(--ink-3);margin-top:var(--s-3)}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx-grid{border-collapse:collapse;font-size:12px;min-width:100%}
.mx-grid th,.mx-grid td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.mx-grid th.rowh{text-align:left;font-weight:400;color:var(--ink-2)}
.mx-grid th.colh{font-weight:400;color:var(--ink-3);vertical-align:bottom;line-height:1.25;
                 white-space:normal;min-width:76px;max-width:96px}
.mx-grid th.colh.hit{font-weight:700;color:var(--ink);background:var(--surface-sunk)}
.mx-grid td.hit{background:var(--surface-sunk)}
.mx-dot{display:inline-block;width:7px;height:7px;border-radius:var(--r-pill);background:var(--ink)}
.mx-dot.rev{background:transparent;border:1.5px solid var(--ink-3)}
.mx-legend{font-size:12px;color:var(--ink-3);margin-top:var(--s-2)}

/* ==========================================================================
   커버리지 미터
   ========================================================================== */
.cov-meter{display:flex;gap:3px;margin-bottom:var(--s-2)}
.cov-meter i{flex:1;height:10px;border-radius:var(--r-2);background:var(--line);display:block}
.cov-meter i.on{background:var(--ink-2)}
.cov-list{display:flex;flex-direction:column;gap:var(--s-2)}
.cov-item{display:flex;gap:var(--s-2);align-items:flex-start;font-size:14px;line-height:1.6;color:var(--ink-2)}
.cov-item svg{width:16px;height:16px;flex:none;margin-top:4px;color:var(--ink-3)}
.cov-sub{font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.08em;
         text-transform:uppercase;color:var(--ink-3);margin-top:var(--s-4)}

/* ==========================================================================
   메서드 + 파이프라인 통합 블록
   ========================================================================== */
.mt-box{margin-top:var(--s-8);padding:var(--s-4);background:var(--surface-sunk);
        border:1px solid var(--line);border-radius:var(--r-14);
        font-size:12px;line-height:1.7;color:var(--ink-2)}
.mt-eyebrow{font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.08em;
            text-transform:uppercase;color:var(--ink-3);margin-bottom:var(--s-2)}
.mt-step{display:flex;gap:var(--s-2);align-items:flex-start;padding:3px 0}
.mt-step b{font-family:var(--font-num);color:var(--ink-3);font-weight:700;flex:none;width:14px}
.mt-dl{display:grid;grid-template-columns:92px 1fr;gap:var(--s-1) var(--s-3);margin:var(--s-3) 0 0;
       padding-top:var(--s-3);border-top:1px solid var(--line)}
.mt-dl dt{color:var(--ink-3);font-weight:400;margin:0}
.mt-dl dd{margin:0;color:var(--ink);font-weight:700;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.mt-note{margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--line);
         color:var(--ink-2);font-weight:400}

/* ==========================================================================
   유형 8색 — 딥톤. **결과 공개 블록과 공유 카드 배경에만** 쓴다.
   판정·기전·등급 근처의 작은 요소에는 절대 쓰지 않는다. 색이 판정 신호로
   읽히는 순간 「보라색이면 괜찮은가」가 되기 때문이다.

   · hue 70°–170°(초록·연두·민트) 는 하나도 없다. 제일 흔한 결과가 「주의 0건」이라
     초록 한 점이 「내 조합은 문제 없다」로 읽힌다.
   · 심각도 팔레트와는 채도·명도를 갈라 두었다.
       심각도 warn  #B42318 = h4   s78% L40%
       심각도 time  #B54708 = h24  s91% L37%
       심각도 check #175CD3 = h218 s80% L46%
     유형색은 전부 s≤52% · L≤34% 의 딥톤이고, 심각도의 빨강(h0–30)·선명한
     파랑(h218 s80) 대역을 비운 h228–342 구간에만 놓았다. 유일하게 h가 가까운
     none(h228)은 s9% 라 색이라기보다 건메탈 회색으로 읽힌다.
   · --tp-1 = 그라데이션 밝은 끝(대비 계산의 바닥), --tp-2 = 어두운 끝.
     흰 텍스트 대비는 --tp-1 기준 전부 8.3:1 이상 (WCAG AA 4.5 / AAA 7 통과).
   · 이웃한 hue 끼리는 채도·명도를 번갈아 준다(진한 채도 ↔ 옅은 채도). 7색을
     h238–342 의 104° 안에 나눠 담으면 이웃 간격이 17° 밖에 안 되는데, 색상만
     달리하면 「기초 다지기」와 「스택 빌더」가 같은 보라로 보인다.
   ========================================================================== */
.tp-none   {--tp-1:#4A4D59;--tp-2:#33353D}   /* 건메탈 h228 s9  W 8.39 */
.tp-minimal{--tp-1:#272A82;--tp-2:#1A1C56}   /* 딥인디고 h238 s54 W12.12 */
.tp-basic  {--tp-1:#4F427B;--tp-2:#382E56}   /* 뮤트바이올렛 h254 s30 W 8.75 */
.tp-stack  {--tp-1:#4A2370;--tp-2:#33184E}   /* 바이올렛 h270 s52 W11.85 */
.tp-broad  {--tp-1:#6B3B78;--tp-2:#4A2852}   /* 뮤트퍼플 h288 s34 W 8.32 */
.tp-vital  {--tp-1:#6B2466;--tp-2:#491845}   /* 마젠타퍼플 h304 s50 W10.15 */
.tp-beauty {--tp-1:#7D2C5F;--tp-2:#531D3F}   /* 마젠타 h322 s48 W 8.80 */
.tp-gut    {--tp-1:#5C2D3B;--tp-2:#3E1E28}   /* 딥플럼 h342 s34 W11.03 */

/* ==========================================================================
   유형 공개 — 「결과를 받는 순간」
   ========================================================================== */
.wf-reveal{
  position:relative;flex:none;text-align:center;overflow:hidden;
  background:linear-gradient(152deg,var(--tp-1) 0%,var(--tp-2) 100%);
  border:none;border-radius:var(--r-24);box-shadow:var(--sh-4);
  padding:var(--s-8) var(--s-5) var(--s-6);
  display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
}
/* 장식 링 — 배경 위에 흰 알파만 얹는다. 텍스트 대비 바닥은 --tp-1 그대로다. */
.wf-reveal::before{
  content:"";position:absolute;left:50%;top:-96px;width:280px;height:280px;
  transform:translateX(-50%);border-radius:var(--r-pill);
  background:radial-gradient(circle,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 62%);
  pointer-events:none;
}
.wf-reveal>*{position:relative}
.rv-cap{font-size:13px;font-weight:700;letter-spacing:.02em;color:#CFC9E0}
.rv-icon{
  width:88px;height:88px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);
  color:#fff;display:flex;align-items:center;justify-content:center;margin:var(--s-2) 0 var(--s-1);
}
/* .fx-ico.xl (0,2,0) 이 28px 을 걸고 있어 .rv-icon svg (0,1,1) 로는 못 이긴다.
   유형 엠블럼은 이 화면의 주인공이므로 선택자를 한 칸 올려 44px 을 잡는다. */
.wf-reveal .rv-icon svg{width:44px;height:44px}
.rv-name{font-size:40px;font-weight:800;line-height:1.18;letter-spacing:-.03em;color:#fff}
.rv-line{font-size:16px;line-height:1.6;color:#E6E2F2}
/* 희소도 — 「사용자 중」이 아니라 「가능한 조합 중」이다. 문구에서 이 구분이 흐려지면 안 된다. */
.rv-rare{
  display:inline-flex;align-items:baseline;gap:var(--s-2);margin-top:var(--s-2);
  padding:8px 15px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
}
.rv-rare b{font-family:var(--font-num);font-size:22px;font-weight:800;color:#fff;
           font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rv-rare span{font-size:13px;font-weight:700;color:#EDEAF6}
.rv-rare-src{font-size:12px;line-height:1.6;color:#CFC9E0;max-width:27em}
.rv-why{font-size:13px;line-height:1.6;color:#CFC9E0;
        margin-top:var(--s-2);padding-top:var(--s-3);border-top:1px solid rgba(255,255,255,.16);
        width:100%}

/* 진입 연출 — 아이콘 → 이름 → 한 줄 → 희소도 순. reduced-motion 은 위 @media 가
   duration·delay 를 함께 0 으로 내려 최종 상태로 바로 앉힌다. */
@keyframes rv-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rv-pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
/* fill-mode 는 both 가 아니라 backwards 다. both 로 두면 애니메이션이 끝난 뒤에도
   키프레임의 최종 상태에 고정돼, 연출이 도중에 끊긴 환경에서 글자가 사라진 채 남는다.
   backwards 는 지연 동안만 from 상태를 쓰고 끝나면 원래 스타일(=보이는 상태)로 돌아온다. */
.wf-reveal>*{animation:rv-up 460ms var(--e-out) backwards}
.wf-reveal .rv-cap{animation-delay:40ms}
.wf-reveal .rv-icon{animation:rv-pop 520ms var(--e-snap) backwards;animation-delay:140ms}
.wf-reveal .rv-name{animation-delay:400ms}
.wf-reveal .rv-line{animation-delay:560ms}
.wf-reveal .rv-rare{animation-delay:700ms}
.wf-reveal .rv-rare-src{animation-delay:780ms}
.wf-reveal .rv-why{animation-delay:860ms}

/* ==========================================================================
   유형 노트 / 접힘 블록 공용
   ========================================================================== */
.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-14);
      box-shadow:var(--sh-1);padding:var(--s-3) var(--s-4)}
.fold>summary{font-size:15px;font-weight:700;color:var(--brand-600);cursor:pointer;list-style:none;
              min-height:28px;display:flex;align-items:center}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:" \25B8";color:var(--ink-3);margin-left:auto}
.fold[open]>summary::after{content:" \25BE"}
.fold-body{font-size:14px;line-height:1.7;color:var(--ink-2);margin-top:var(--s-2);
           padding-top:var(--s-2);border-top:1px solid var(--line)}

/* ==========================================================================
   복용 시간표
   ========================================================================== */
.wf-time{display:flex;flex-direction:column;flex:none}
.wf-time .tm-row{display:flex;gap:var(--s-4);align-items:flex-start;padding:var(--s-3) 0}
.wf-time .tm-row + .tm-row{border-top:1px solid var(--line)}
.wf-time .tm-when{width:78px;flex:none;font-size:15px;font-weight:700;color:var(--ink);
                  display:flex;flex-direction:column;gap:2px}
.wf-time .tm-when span{font-family:var(--font-num);font-size:12px;font-weight:400;color:var(--ink-3)}
.wf-time .tm-what{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s-1)}
.wf-time .tm-what .n{font-size:15px;color:var(--ink-2);line-height:1.5}
.wf-time .tm-what .why{font-size:13px;line-height:1.5;color:var(--sev-time);font-weight:700}

/* ==========================================================================
   고지 / 비교표
   ========================================================================== */
.wf-disclaim{
  flex:none;background:var(--surface-sunk);border:1px solid var(--line);border-radius:var(--r-14);
  padding:var(--s-3) var(--s-4);font-size:12px;line-height:1.55;color:var(--ink-2);
}
.wf-disclaim b{color:var(--ink);font-weight:700}

.wf-compare{display:flex;flex-direction:column;flex:none}
.wf-compare .cp-row{display:flex;align-items:center;gap:var(--s-2);padding:10px 0;font-size:15px;line-height:1.5}
.wf-compare .cp-row + .cp-row{border-top:1px solid var(--line)}
.wf-compare .cp-name{flex:1;min-width:0;color:var(--ink-2)}
.wf-compare .cp-web,.wf-compare .cp-app{width:44px;flex:none;display:flex;align-items:center;justify-content:center}
.wf-compare .cp-web svg{width:18px;height:18px;color:var(--ink-3)}
.wf-compare .cp-app svg{width:18px;height:18px;color:var(--brand-600)}
.wf-compare .cp-partial{font-family:var(--font-num);font-size:14px;color:var(--ink-3)}
.wf-compare .cp-head{font-family:var(--font-num);font-size:11px;font-weight:700;letter-spacing:.08em;
                     text-transform:uppercase;color:var(--ink-3);padding-bottom:var(--s-2)}
.wf-compare .cp-head .cp-app{color:var(--brand-600)}

/* ==========================================================================
   바텀시트 / 딤 / 토스트
   ========================================================================== */
.wf-dim{position:fixed;inset:0;z-index:300;background:rgba(16,24,40,.45);border:none;padding:0;
        animation:fade-in var(--d-3) var(--e-out)}
.wf-sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:310;
  background:var(--surface);border-radius:var(--r-28) var(--r-28) 0 0;box-shadow:var(--sh-5);
  padding:var(--s-3) var(--s-5) calc(var(--s-6) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:var(--s-4);max-height:86vh;overflow-y:auto;
  animation:sheet-in var(--d-3) var(--e-out);
}
.sh-grab{width:36px;height:4px;border-radius:var(--r-pill);background:var(--line-ctrl);
         margin:0 auto var(--s-2);flex:none}
@keyframes sheet-in{from{transform:translate(-50%,24px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

.wf-toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:400;
  background:var(--brand-900);color:#fff;border-radius:var(--r-pill);padding:11px 18px;
  font-size:14px;font-weight:700;line-height:1.5;max-width:92vw;text-align:center;
  box-shadow:var(--sh-4);
}
.wf-toast[hidden]{display:none}

.wf-anchor{scroll-margin-top:56px}
.wf-x{background:none;border:none;font-family:inherit;cursor:pointer;padding:0 0 0 6px;
      color:var(--ink-3);font-size:14px;font-weight:700}
.wf-searchinput{
  border:none;background:transparent;outline:none;font-family:inherit;font-size:16px;
  font-weight:400;color:var(--ink);width:100%;padding:0;
}
.wf-searchinput::placeholder{color:var(--ink-3)}
.wf-sharehint{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.55}

/* ==========================================================================
   카메라 뷰 (데모)
   ========================================================================== */
.wf-cam{flex:1;background:var(--brand-900);position:relative;display:flex;
        align-items:center;justify-content:center;min-height:340px}
.wf-cam .cm-guide{
  width:74%;height:46%;border:2px dashed rgba(255,255,255,.6);border-radius:var(--r-18);
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.86);
  font-size:15px;font-weight:700;text-align:center;line-height:1.6;padding:var(--s-4);
}
.wf-cam .cm-hint{
  position:absolute;left:var(--s-4);right:var(--s-4);bottom:var(--s-4);
  background:rgba(0,0,0,.55);color:#fff;border-radius:var(--r-10);padding:10px 13px;
  font-size:13px;line-height:1.55;text-align:center;
}
.wf-cam .cm-demo{
  position:absolute;left:var(--s-4);right:var(--s-4);top:var(--s-4);
  background:var(--demo-bg);color:var(--demo);border:1px solid var(--demo-line);
  border-radius:var(--r-10);padding:8px 12px;font-size:12px;font-weight:700;text-align:center;
}

/* ==========================================================================
   공유 카드 — 유일한 다크 아일랜드. 라디얼 글로우 없음
   ========================================================================== */
/* 배경만 유형색으로 갈아입는다. 위쪽이 --tp-2(딥톤 어두운 끝), 아래로 갈수록
   기존 카드 잉크로 떨어진다. --tp-2 는 전부 L≤23% 라 카드 안의 기존 글자색
   (--card-mut #A6B0C0 이 최저)이 그 위에서도 5.5:1 이상을 유지한다.
   등급 칩 색(sc-warn/time/check)은 그대로다 — 유형색이 판정 신호를 덮지 않는다. */
.wf-sharecard{
  width:100%;max-width:320px;margin:0 auto;aspect-ratio:9/16;flex:none;
  background:linear-gradient(168deg,var(--tp-2,var(--card-ink-2)) 0%,var(--card-ink-1) 82%);
  border-radius:var(--r-24);box-shadow:var(--sh-4);padding:var(--s-6) var(--s-5);
  display:flex;flex-direction:column;justify-content:space-between;color:var(--card-fg);overflow:hidden;
}
.sc-badge{font-size:12px;color:var(--card-mut)}
/* 카드 안 희소도 — 「가능한 조합 중」임을 카드에서도 흐리지 않는다 */
.sc-rare{display:inline-flex;align-items:baseline;gap:6px;align-self:flex-start;
  padding:5px 11px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26)}
.sc-rare b{font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--card-fg);
           font-variant-numeric:tabular-nums}
.sc-rare span{font-size:11px;font-weight:700;color:#D6DCE8}
.sc-top{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-2)}
.sc-icon{width:44px;height:44px;color:var(--card-fg)}
.sc-tname{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--card-fg)}
.sc-tline{font-size:14px;color:var(--card-mut)}
/* 위 여백을 키운 것은 .sc-rare 가 sc-top 에 들어오면서 레이더의 「기초」 축 라벨
   (.rd-l.t, top:-6px 로 밖에 걸린다)과 붙어 버렸기 때문이다. */
.sc-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:var(--s-6) 0 var(--s-3)}
.sc-bot{display:flex;flex-direction:column;gap:var(--s-2);flex:none}
.sc-stat{font-size:13px;color:var(--card-mut);line-height:1.55}
.sc-stat b{font-family:var(--font-num);color:var(--card-fg);font-size:18px}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--card-line);
         border-radius:var(--r-6);padding:4px 9px;font-size:12px;font-weight:700;color:var(--card-fg)}
.sc-chip i{width:6px;height:6px;border-radius:var(--r-pill);flex:none;background:currentColor}
.sc-chip.sc-warn{color:var(--card-warn)} .sc-chip.sc-time{color:var(--card-time)}
.sc-chip.sc-check{color:var(--card-check)} .sc-chip.sc-none{color:var(--card-mut);font-weight:400}
.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);flex:none}
.sc-word{font-size:15px;font-weight:700;color:var(--card-fg)}
.sc-tag{font-size:12px;color:var(--card-mut)}
/* 카드 안에 박는 데모 표식 — 캡처본에도 반드시 따라가야 한다 */
.sc-demo{flex:none;margin-top:var(--s-2);padding-top:var(--s-2);
  border-top:1px solid var(--card-line);
  font-size:11px;font-weight:600;letter-spacing:.1px;color:var(--card-mut);text-align:center}

/* 대조한 쌍 = 점 하나. 이름은 안 실리고 규모만 보인다. (리포트 본문용) */
.sc-grid{display:flex;flex-wrap:wrap;gap:7px}
.sc-dot{width:12px;height:12px;border-radius:var(--r-pill);background:var(--line);flex:none}
.sc-dot.sc-warn{background:var(--sev-warn-mark)}
.sc-dot.sc-time{background:var(--sev-time-mark)}
.sc-dot.sc-check{background:var(--sev-check-mark)}
.card .sc-stat{color:var(--ink-3)}
.card .sc-stat b{color:var(--ink)}
.card .sc-more{color:var(--ink-3)}
.card .sc-chip{border-color:var(--line);color:var(--ink-2);background:var(--surface-sunk)}
.card .sc-chip.sc-warn{color:var(--sev-warn)}
.card .sc-chip.sc-time{color:var(--sev-time)}
.card .sc-chip.sc-check{color:var(--sev-check)}
.card .sc-chip.sc-none{color:var(--ink-3)}

/* ---------- 4축 레이더 (공유 카드 안에서만 쓴다) ---------- */
.rd-wrap{position:relative;width:100%;max-width:170px;margin:0 auto;aspect-ratio:1}
.rd{width:100%;height:100%;display:block;overflow:visible}
.rd-ring{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
.rd-ax{stroke:rgba(255,255,255,.10);stroke-width:1}
.rd-area{fill:rgba(255,255,255,.16);stroke:#C7D3E8;stroke-width:1.75;stroke-linejoin:round}
.rd-dot{fill:#E6EDF9}
.rd-dot.off{fill:rgba(255,255,255,.22)}
.rd-l{position:absolute;font-size:11px;font-weight:700;color:var(--card-mut);white-space:nowrap}
.rd-l.t{top:-6px;left:50%;transform:translateX(-50%)}
.rd-l.b{bottom:-6px;left:50%;transform:translateX(-50%)}
.rd-l.l{left:-8px;top:50%;transform:translateY(-50%)}
.rd-l.r{right:-8px;top:50%;transform:translateY(-50%)}

/* ==========================================================================
   가족 보드
   ========================================================================== */
.fm-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-18);
         box-shadow:var(--sh-1);overflow:hidden}
.fm-row{width:100%;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4);
        background:none;border:0;cursor:pointer;text-align:left;
        transition:background-color var(--d-2) var(--e-out)}
.fm-item{display:flex;align-items:stretch}
.fm-item + .fm-item{border-top:1px solid var(--line)}
.fm-item .fm-row{flex:1;min-width:0}
.fm-del{flex:none;width:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-left:1px solid var(--line);cursor:pointer;color:var(--ink-5)}
.fm-del:hover{background:var(--sev-warn-bg);color:var(--sev-warn)}
.fm-row + .fm-row{border-top:1px solid var(--line)}
.fm-row:hover{background:var(--brand-50)}
.fm-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.fm-label{font-size:16px;font-weight:700;color:var(--ink)}
.fm-meta{font-size:13px;color:var(--ink-3);font-family:var(--font-num)}
.fm-type{font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-6);
         background:var(--surface-sunk);color:var(--ink-2);flex:none}
.fm-when{font-size:12px;color:var(--ink-3);font-family:var(--font-num);flex:none;
         display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.fm-row svg{color:var(--ink-3)}

.fm-slots{display:flex;flex-direction:column;gap:var(--s-2)}
.fm-slot{display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-4);
         background:transparent;border:1px dashed var(--line-ctrl);border-radius:var(--r-14)}
.fm-slot .fm-label{color:var(--ink-3);font-weight:400}
.fm-slot-btns{display:flex;gap:var(--s-2);flex-wrap:wrap}

.fm-demo{background-image:repeating-linear-gradient(45deg,transparent 0 6px,
         rgba(102,112,133,.07) 6px 12px);
         border:1px dashed var(--line-ctrl);border-radius:var(--r-14);opacity:.85;cursor:default}
.fm-demo .fm-row:hover{background:transparent}
.fm-badge{font-size:11px;border:1px dashed var(--line-ctrl);border-radius:var(--r-pill);
          padding:2px 8px;color:var(--ink-3);flex:none}

.fm-ctx{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-3);
        background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--r-10);
        font-size:13px;color:var(--brand-700);margin-bottom:var(--s-3)}
.fm-ctx svg{color:var(--brand-600);flex:none}
.fm-ctx-t{flex:1;min-width:0}
.fm-ctx-x{background:none;border:0;color:var(--brand-600);font-size:13px;font-weight:700;
          cursor:pointer;text-decoration:underline;flex:none}
.fm-done{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--brand-600)}
.fm-done svg{width:13px;height:13px}

/* ==========================================================================
   초대 시트
   ========================================================================== */
.inv-tabs{display:flex;gap:var(--s-2)}
.inv-msgs{display:flex;flex-direction:column;gap:var(--s-2)}
.inv-msg{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-ctrl);
         border-radius:var(--r-14);padding:var(--s-3) var(--s-4);font-family:inherit;font-size:15px;
         line-height:1.6;color:var(--ink-2);cursor:pointer;display:flex;gap:var(--s-3);align-items:flex-start;
         transition:border-color var(--d-2) var(--e-out),background-color var(--d-2) var(--e-out)}
.inv-msg:hover{border-color:var(--brand-500);background:var(--brand-50)}
.inv-msg.on{border-color:var(--brand-500);background:var(--brand-50);color:var(--ink)}
.inv-radio{width:18px;height:18px;border-radius:var(--r-pill);border:1.5px solid var(--line-ctrl);
           flex:none;margin-top:4px;position:relative}
.inv-msg.on .inv-radio{border-color:var(--brand-600)}
.inv-msg.on .inv-radio::after{content:"";position:absolute;inset:3px;border-radius:var(--r-pill);
                              background:var(--brand-700)}
.inv-nolink{font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.inv-text{width:100%;min-height:88px;resize:vertical;background:var(--surface-sunk);
          border:1px solid var(--line-ctrl);border-radius:var(--r-10);padding:var(--s-3);
          font-family:inherit;font-size:15px;line-height:1.6;color:var(--ink)}
.inv-note{font-size:12px;color:var(--ink-3);line-height:1.6}

/* ==========================================================================
   리포트 진입 스태거
   ========================================================================== */
.stagger>*{animation:rise var(--d-4) var(--e-out) both}
.stagger>:nth-child(1){animation-delay:0ms}   .stagger>:nth-child(2){animation-delay:40ms}
.stagger>:nth-child(3){animation-delay:80ms}  .stagger>:nth-child(4){animation-delay:120ms}
.stagger>:nth-child(5){animation-delay:160ms} .stagger>:nth-child(6){animation-delay:200ms}
.stagger>:nth-child(7){animation-delay:240ms} .stagger>:nth-child(n+8){animation-delay:280ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 포커스 후광은 컴포넌트 규칙보다 뒤에 와야 이긴다 (.big-btn.secondary 등이 box-shadow 를 쓴다) */
.big-btn:focus-visible,.chip:focus-visible,.wf-tile:focus-visible,.row-card:focus-visible,
.fm-slot:focus-visible,.fm-row:focus-visible,.inv-msg:focus-visible,
.v-jump:focus-visible,.fm-ctx-x:focus-visible{box-shadow:var(--sh-focus)}
</style>
</head>
<body>

/* ---- 기전 엔진 — 선택 항목을 성분으로 펼쳐 기전별로 모은다 ---- */
function mechProfile(rxIds, suppIds) {
  const prof = {};
  rxIds.concat(suppIds).forEach(function (item) {
    (COMPOSITION[item] || []).forEach(function (ingId) {
      const ing = INGREDIENTS.filter(function (o) { return o.id === ingId; })[0];
      if (!ing) return;
      ing.mechs.forEach(function (e) {
        (prof[e.m] = prof[e.m] || []).push(
          { item: item, ing: ingId, ev: e.ev, role: e.role || null, dir: e.dir || 0 });
      });
    });
  });
  return prof;
}

/* 같은 item 은 하나로 접는다. 접을 때 근거가 가장 강한 간선을 남긴다.
   ⚠ 같은 item 안의 성분끼리는 절대 스택시키지 않는다 — 종합비타민 한 알 안의
     비타민A+D 는 이미 배합된 제품이라 「겹침」이 아니다. */
function uniqItems(entries) {
  const by = {};
  entries.forEach(function (e) {
    const cur = by[e.item];
    if (!cur || EVIDENCE[e.ev].rank > EVIDENCE[cur.ev].rank) by[e.item] = e;
  });
  return Object.keys(by).map(function (k) { return by[k]; });
}

function mechOf(id) { return MECHANISMS.filter(function (M) { return M.id === id; })[0]; }
function ingName(id) { const o = INGREDIENTS.filter(function (x) { return x.id === id; })[0]; return o ? o.name : id; }
function minEv(entries) {
  return entries.reduce(function (a, e) {
    return EVIDENCE[e.ev].rank < EVIDENCE[a].rank ? e.ev : a; }, 'established');
}
function keyOf(ids) { return ids.slice().sort().join('|'); }

/* 조사 문제를 피하려고 「…에서 {plain}이 …」 형태로 고정한다.
   MECHANISMS.plain 은 전부 「작용」 또는 「성분」으로 끝나므로 '이' 가 항상 맞다. */
function mkDerived(M, entries, mode) {
  const items = entries.map(function (e) { return e.item; })
                       .filter(function (v, i, a) { return a.indexOf(v) === i; });
  const names = items.map(itemLabel);
  const ev = minEv(entries);
  const what = (mode === 'oppose')
    ? '<b>' + names.join('</b> · <b>') + '</b>에서 ' + M.plain +
      '이 서로 <b>반대 방향</b>으로 확인됩니다. 한쪽이 다른 쪽을 상쇄하거나 간섭할 수 있습니다.'
    : '고르신 것 가운데 <b>' + names.join('</b> · <b>') + '</b>에서 ' + M.plain + '이 함께 확인됩니다.';
  return {
    level: M.level, pair: names, what: what, how: REMEDY[M.remedy],
    mech: [M.id], ev: ev, via: entries.map(function (e) { return e.ing; }),
    itemIds: items, derived: true
  };
}

function derive(prof) {
  const out = [];
  MECHANISMS.forEach(function (M) {
    const es = prof[M.id]; if (!es || M.derive === 'none') return;
    if (M.derive === 'pair') {
      const src = es.filter(function (e) { return e.role === 'source'; });
      const tgt = es.filter(function (e) { return e.role === 'target'; });
      src.forEach(function (a) { tgt.forEach(function (b) {
        if (a.item === b.item) return;
        out.push(mkDerived(M, [a, b], 'pair'));
      }); });
    } else {                                   /* stack */
      if (M.dir) {
        const plus  = uniqItems(es.filter(function (e) { return e.dir > 0; }));
        const minus = uniqItems(es.filter(function (e) { return e.dir < 0; }));
        if (plus.length >= (M.minItems || 2)) out.push(mkDerived(M, plus, 'stack'));
        if (plus.length >= 1 && minus.length >= 1) out.push(mkDerived(M, plus.concat(minus), 'oppose'));
      } else {
        const u = uniqItems(es);
        if (u.length >= (M.minItems || 2)) out.push(mkDerived(M, u, 'stack'));
      }
    }
  });
  return out;
}

   숫자·영문으로 끝나면 목업 표기(오메가3는)를 따라 '는'. */
function eunNeun(word) {
  const c = word.charCodeAt(word.length - 1);

  return '는';
}

function loadMembers() {
  const raw = storeGet(KEY_M); if (!raw) return [];
  try {
    const arr = JSON.parse(raw); if (!Array.isArray(arr)) return [];
    const rxIds = RX_LIST.map(function (o) { return o.id; });

    const cdIds = COND_LIST.map(function (o) { return o.id; });
    const rlIds = REL_LIST.map(function (o) { return o.id; });
    const keep = function (v, ok) {
      return Array.isArray(v) ? v.filter(function (x) { return ok.indexOf(x) !== -1; }) : [];
    };
    return arr.filter(function (m) { return m && typeof m.id === 'string'; }).map(function (m) {
      return {
        id: String(m.id).slice(0, 24),
        rel: has(rlIds, m.rel) ? m.rel : 'other',
        label: String(m.label || '가족').slice(0, 12),
        rx: keep(m.rx, rxIds), supps: keep(m.supps, spIds),
        age: has(agIds, m.age) ? m.age : null, conds: keep(m.conds, cdIds),
        customs: Array.isArray(m.customs)

        savedAt: String(m.savedAt || '').slice(0, 20)

function loadData(d) {

    }
  });

  RX_PAIR_RULES.forEach(function (r) {
    if (has(rx, r.a) && has(rx, r.b)) {
      findings.push({ level: r.level, pair: [rxName(r.a), rxName(r.b)], what: r.what, how: r.how,
        mech: r.mech, ev: r.ev, via: r.via, itemIds: [r.a, r.b],
        rule: 'RULE ' + r.a + '-' + r.b });
    }
  });

  INFO_RULES.forEach(function (r) {
    const w = r.when;
    const ok =
      (w.rx    || []).every(function (id) { return has(rx, id); }) &&
      (w.supps || []).every(function (id) { return has(supps, id); }) &&
      (w.conds || []).every(function (id) { return has(conds, id); }) &&
      (w.rxNot || []).every(function (id) { return !has(rx, id); }) &&
      (!w.condsAny || w.condsAny.some(function (id) { return has(conds, id); }));
    /* 3040 변형: INFO_RULES 에 level 을 지정하면(예: 임신 금기) info 가 아니라
       그 등급으로 뜬다 — 근거가 이미 확립된 것까지 회색 "알아두기"로 묻히지
       않게 하기 위한 확장이다. 지정이 없으면 원래대로 info. */
    if (ok) findings.push({ level: r.level || 'info', pair: r.pair, what: r.what, how: r.how,
      mech: r.mech, ev: r.ev, via: r.via,
      itemIds: (w.rx || []).concat(w.supps || []), rule: 'INFO ' + r.id });
  });

  /* ---- v2: 성분 특성에서 자동 도출한 것을 합류시킨다 ----
     판정의 권위는 위의 큐레이션 규칙에 있다. 여기서 나오는 것은 설명 보강이며
     절대 warn 을 만들지 않는다(MECHANISMS 의 level 은 time/check 뿐). */
  const prof = mechProfile(rx, supps);
  const curatedKeys = findings.filter(function (f) { return f.itemIds && f.itemIds.length; })
                              .map(function (f) { return keyOf(f.itemIds); });

  const merged = {};
  derive(prof).forEach(function (d) {
    const k = keyOf(d.itemIds);
    if (curatedKeys.indexOf(k) !== -1) return;              /* 큐레이션이 이긴다 */
    if (!merged[k]) { merged[k] = d; return; }              /* 같은 항목 집합은 한 장으로 */
    const m = merged[k];
    m.mech = m.mech.concat(d.mech);
    m.via  = m.via.concat(d.via);
    m.what = m.what + ' ' + d.what;
    if (levelRank(d.level) < levelRank(m.level)) m.level = d.level;
    if (EVIDENCE[d.ev].rank > EVIDENCE[m.ev].rank) m.ev = d.ev;
  });

  const derivedList = Object.keys(merged).map(function (k) { return merged[k]; })
    .sort(function (a, b) {
      return EVIDENCE[b.ev].rank - EVIDENCE[a.ev].rank || levelRank(a.level) - levelRank(b.level);
    })
    .slice(0, 4);                                            /* 상한 4건 */

  const nCurated = findings.filter(function (f) { return f.level !== 'info'; }).length;
  derivedList.forEach(function (d) { d.rule = 'DERIVED ' + d.mech[0]; findings.push(d); });

  const order = { warn: 0, time: 1, check: 2, info: 3 };
  findings.sort(function (a, b) { return order[a.level] - order[b.level]; });

  const counts = { warn: 0, time: 0, check: 0, info: 0 };
  findings.forEach(function (f) { counts[f.level]++; });

  /* N 은 등급이 있는 것만 센다. 알아두기(info)는 "확인이 필요한 건수"가 아니다. */
  return { findings: findings, counts: counts, n: counts.warn + counts.time + counts.check,
           nCurated: nCurated, nDerived: derivedList.length, prof: prof };
}

/* SPEC §5 — 기본 배치 후 time 규칙의 suppSlot 으로 옮긴다. */
function buildSchedule(result) {
  const bySupp = {};
  result.findings.forEach(function (f) {
    if (f.level !== 'time' || !f.supp) return;
    if (!bySupp[f.supp]) bySupp[f.supp] = { slot: f.suppSlot, whys: [] };
    if (bySupp[f.supp].whys.indexOf(f.why) === -1) bySupp[f.supp].whys.push(f.why);
  });

  const rows = {};
  SLOTS.forEach(function (s) { rows[s.id] = []; });

  realRx().forEach(function (id) {
    rows[DEFAULT_SLOT[id]].push({ name: rxName(id), why: '' });
  });
  state.supps.forEach(function (id) {
    const moved = bySupp[id];
    const slot = moved ? moved.slot : DEFAULT_SLOT[id];
    rows[slot].push({ name: suppName(id), why: moved ? moved.whys.join(' · ') : '' });
  });

  return SLOTS.filter(function (s) { return rows[s.id].length > 0; })
              .map(function (s) { return { slot: s, items: rows[s.id] }; });
}


/* ==========================================================================
   5. URL 해시 (SPEC §7) — #r=anti,thy&s=omega3,calmag&a=50&c=none
      x= 는 직접 입력 항목. 스펙에 없지만 없으면 링크로 결과가 재현되지 않는다.
   ========================================================================== */
function buildHash() {
  const parts = [
    'r=' + state.rx.join(','),
    's=' + state.supps.join(','),
    'a=' + (state.age || ''),
    'c=' + state.conds.join(',')
  ];
  if (state.customs.length) {
    parts.push('x=' + state.customs.map(encodeURIComponent).join(','));
  }
  return '#' + parts.join('&');
}
function reportUrl() { return location.href.split('#')[0] + buildHash(); }

/* 초대 링크. 담는 것은 #invite=1 하나뿐 — 약·영양제·연령·특이사항은 담기지 않는다.
   reportUrl() 을 여기서 쓰면 안 된다. 그 해시에 처방약과 임신·수유 여부가 있다. */
function inviteUrl() { return location.href.split('#')[0] + '#invite=1'; }

function parseHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return null;
  const out = {};
  raw.split('&').forEach(function (kv) {
    const i = kv.indexOf('=');
    if (i === -1) return;
    out[kv.slice(0, i)] = kv.slice(i + 1);
  });
  if (!('r' in out) && !('s' in out) && !('a' in out) && !('c' in out)) return null;

  const split = function (v, valid) {
    if (!v) return [];
    return v.split(',').filter(function (x) { return x && valid.indexOf(x) !== -1; });
  };
  const rxIds   = RX_LIST.map(function (o) { return o.id; });
  const suppIds = SUPP_LIST.map(function (o) { return o.id; });
  const ageIds  = AGE_LIST.map(function (o) { return o.id; });
  const condIds = COND_LIST.map(function (o) { return o.id; });

  return {
    rx: split(out.r, rxIds),
    supps: split(out.s, suppIds),
    age: has(ageIds, out.a) ? out.a : null,
    conds: split(out.c, condIds),
    customs: out.x ? out.x.split(',').filter(Boolean).map(decodeURIComponent) : []
  };
}
function applyParsed(p) {
  state.rx = p.rx; state.supps = p.supps; state.age = p.age;
  state.conds = p.conds; state.customs = p.customs;
}


/* ==========================================================================
   6. 화면 전환 — history.pushState 로 뒤로가기를 살린다 (SPEC §2)
   ========================================================================== */
function go(screen, opts) {
  opts = opts || {};
  state.screen = screen;
  state.sheet = opts.sheet || null;
  state.appNotice = false;
  state.copyFallback = '';

  /* v2 — 해시는 「나」의 결과일 때만 쓴다.
     activeId 가 있으면 그것은 가족 구성원의 데이터다. 가족의 처방약·임신 여부가
     주소창에 뜨면 화면 캡처·브라우저 히스토리 동기화로 제3자 민감정보가 샌다.
     가족 리포트는 URL 로 재현하지 않는다 — 재현은 localStorage 가 한다. */
  const isMine = !state.activeId;
  const url = (screen === 'report' && isMine)
    ? location.pathname + location.search + buildHash()
    : location.pathname + location.search;
  const snapshot = { screen: screen, sheet: state.sheet };

  /* file:// 로 그냥 열었을 때 일부 브라우저는 pushState 에 SecurityError 를 던진다.
     그때도 화면 전환 자체는 살아 있어야 한다 — 뒤로가기만 포기한다. */
  try {
    if (opts.replace) history.replaceState(snapshot, '', url);
    else history.pushState(snapshot, '', url);
  } catch (e) {
    /* 해시 대입조차 막는 환경(data: URL 스냅샷 등)이 있다. 거기서도 화면은 살아야 한다. */
    try {
      if (screen === 'report' && isMine) location.hash = buildHash().slice(1);
      else if (location.hash) location.hash = '';   /* 가족 화면으로 갈 때 남은 해시를 지운다 */
    } catch (e2) { /* 주소창을 포기한다 — 화면 전환만 살린다 */ }
  }

  render();
  if (!opts.keepScroll) window.scrollTo(0, 0);
}

window.addEventListener('popstate', function (e) {
  const s = e.state;
  if (s && s.screen) {
    state.screen = s.screen;
    state.sheet = s.sheet || null;
  } else {
    /* 히스토리 진입점 — 해시가 있으면 리포트, 없으면 랜딩 */
    const p = parseHash();
    if (p) { applyParsed(p); state.screen = 'report'; state.activeId = null; }
    else { state.screen = 'landing'; }
    state.sheet = null;
  }
  state.appNotice = false;
  state.copyFallback = '';
  render();
  window.scrollTo(0, 0);
  /* 동의 시트를 닫고 나서 이어서 할 일 (ack-store 참고) */
  if (runAfterPop) { const n = runAfterPop; runAfterPop = null; n(); }
});


/* ==========================================================================
   7. 화면 조각 — 목업 마크업을 그대로 옮기고 값만 상태에서 채운다
   ========================================================================== */

/* 3040 변형: 2단계(영양제 → 처방약+기본정보)로 줄었다. 기본정보(renderProfile)를
   처방약 화면 하단에 합쳐서 화면 수 자체를 줄였기 때문 — 3040은 단계가 많으면 이탈한다. */
function stepsBar(current) {
  const cls = function (i) { return i < current ? 's done' : (i === current ? 's on' : 's'); };
  return '<div class="fx-row gap-sm">' +
    '<div class="wf-steps"><span class="' + cls(0) + '"></span><span class="' + cls(1) + '"></span></div>' +
    '<span class="wf-steplabel">' + (current + 1) + ' / 2</span></div>';
}

function ctaBar(countHtml, act, label) {
  return '<div class="wf-cta">' +
    (countHtml ? '<div class="c-count">' + ico('i-check', 'fx-ico sm') + countHtml + '</div>' : '') +
    '<button class="big-btn primary" data-act="' + act + '">' + label + '</button></div>';
}

   실제 리포트의 축소판(유형 카드 + 기전 행 + 등급 칩)을 그대로 줄여서 보여준다.
   ⚠ 이것은 **예시이지 사용자의 결과가 아니다.** 값은 고정이고, 프레임 안에
     「예시 화면」 라벨을 박고, 아래쪽 기전 행은 블러 + 마스크로 흐린다.
   TYPE_RARITY 를 그대로 참조한다 — 미리보기의 숫자와 진짜 결과의 숫자가

        '</div>' +

      '<span class="lp-mark">예시 화면</span>' +

}

function searchResults() {

  return '<span class="fx-cap">검색 결과 ' + hits.length + '개</span>' +
