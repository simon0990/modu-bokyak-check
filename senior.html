<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 조합 확인하기 — 모두의 복약 (검수 전 프로토타입)</title>
<!-- 1×1 투명 PNG. 브라우저가 /favicon.ico 를 자동으로 요청하는 것까지 막아 요청 0건을 지킨다.
     (data:, 처럼 빈 URI 를 주면 크롬이 무효로 보고 /favicon.ico 를 그대로 때린다) -->
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
<style>
/* ==========================================================================
   tokens.css 사본 — care-app/src/theme/tokens.ts 와 같은 값.
   ⚠ 이 파일(index-senior.html)은 50대 이상 · 약국 대면 채널용 변형이다.
   가독성에 관련된 토큰(글자 크기 · 터치 영역 · 큰 간격 · 보조 텍스트 명암비)만
   의도적으로 키웠다 — 원본 index.html 의 값은 건드리지 않는다.
   나머지 색 토큰은 원본과 동일하다.
   원본의 Google Fonts @import 는 뺐다. 외부 요청 0건이 이 프로토타입의 제약이다.
   ========================================================================== */
:root {
  --primary-navy:      #102A5E;
  --primary-blue:      #2563EB;
  --secondary-blue:    #4F8EF7;
  --light-blue-bg:     #EEF5FF;
  --card-bg:           #FFFFFF;
  --border:            #D8E5F6;
  --text:              #1F2937;
  --text-secondary:    #4B5563;
  --success-green:     #36B37E;
  --warning-orange:    #F5A623;
  --danger-red:        #E25353;
  --condition-purple:  #8B5CF6;

  --screen-bg:         #F7FAFF;
  --green-bg:          #E6F9F1;
  --orange-bg:         #FFF8ED;
  --red-bg:            #FFF0F0;
  --purple-bg:         #F3EEFF;

  /* 시니어 변형 — 본문/강조/제목 글자 키움. 히어로 숫자는 오히려 낮춤
     (원본 40px 그대로면 리포트 판정 숫자가 지나치게 커져 카드 비례가 깨진다). */
  --fs-body:      20px;
  --fs-emphasis:  26px;
  --fs-title:     28px;
  /* 이 토큰은 리포트 판정 숫자(.wf-verdict .v-num) 한 곳에만 쓰인다.
     「주의 N건」은 이 화면에서 가장 먼저 읽혀야 하는 숫자라 원본 40px보다 키운다. */
  --fs-hero:      44px;

  --sp-xs:  4px;
  --sp-sm:  8px;
  --sp-md: 16px;
  --sp-lg: 28px;
  --sp-xl: 32px;

  --r-card:   16px;
  --r-button: 14px;
  --r-pill:   999px;

  /* 시니어 변형 — 버튼 최소 터치 영역 확대 */
  --min-touch: 64px;

  --demo-strip-h: 38px;
}

* { box-sizing: border-box; }

/* ==========================================================================
   페이지 셸 — 목업의 폰 프레임(.phone / .statusbar / .wf-urlbar / .wf-fold)을
   전부 걷어냈다. 여기서는 브라우저가 그 역할을 한다.
   ========================================================================== */
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: #E9EFF9;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  color: var(--text);
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* SPEC §1 — 검수가 끝나기 전에는 절대 제거하지 않는다. */
.demo-strip {
  position: sticky; top: 0; z-index: 200;
  min-height: var(--demo-strip-h);
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  background: #7C2D12; color: #FFE8D6;
  font-size: 13px; font-weight: 700; line-height: 1.4;
  padding: 7px 14px; text-align: center;
}
.demo-strip svg { width: 15px; height: 15px; flex: none; color: #FDBA74; }

.app {
  max-width: 430px;
  margin: 0 auto;
  background: var(--screen-bg);
  min-height: calc(100vh - var(--demo-strip-h));
  display: flex;
  flex-direction: column;
}
@media (min-width: 486px) {
  .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}

.screen-body {
  flex: 1;
  padding: var(--sp-lg);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.screen-body.no-pad { padding: 0; }

/* ScreenHeader.tsx */
.screen-header {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card-bg);
  padding: 8px 12px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: var(--demo-strip-h); z-index: 30;
}
.screen-header .sh-side { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
.screen-header .sh-title {
  flex: 1; text-align: center;
  font-size: var(--fs-title); font-weight: 700; color: var(--primary-navy);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ==========================================================================
   컴포넌트 — care-app/src/components/*.tsx 대응 (tokens.css 사본)
   ========================================================================== */
.big-btn {
  min-height: var(--min-touch);
  border-radius: var(--r-button);
  display: flex; align-items: center; justify-content: center; gap: var(--sp-sm);
  padding: 14px 16px;
  margin: 6px 0;
  font-size: var(--fs-emphasis); font-weight: 700; font-family: inherit;
  border: none; cursor: pointer; flex: none;
  width: 100%;
  text-align: center;
}
.big-btn.primary   { background: var(--primary-blue); color: #fff; box-shadow: 0 6px 14px rgba(37, 99, 235, 0.30); }
.big-btn.secondary { background: var(--card-bg); color: var(--primary-blue); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(16, 42, 94, 0.06); }
.big-btn.ghost     { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); box-shadow: none; }
.big-btn:disabled  { opacity: .45; cursor: default; }

.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-md); flex: none; }
.card.elevated { box-shadow: 0 2px 8px rgba(16, 42, 94, 0.05); }

.row-card {
  display: flex; align-items: center; gap: var(--sp-md);
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-card);
  padding: var(--sp-md); flex: none;
  width: 100%; text-align: left; font-family: inherit; color: inherit;
}
button.row-card { cursor: pointer; }

.icon-box {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--light-blue-bg);
  display: flex; align-items: center; justify-content: center;
  flex: none; color: var(--primary-blue);
}
.icon-box.lg     { width: 56px; height: 56px; border-radius: var(--r-card); }
.icon-box.orange { background: var(--orange-bg); color: var(--warning-orange); }
.icon-box.purple { background: var(--purple-bg);  color: var(--condition-purple); }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--r-pill);
  font-size: 14px; font-weight: 700; flex: none;
}
.tag.rx    { background: var(--light-blue-bg); color: var(--primary-blue); }
.tag.suppl { background: var(--purple-bg);     color: var(--condition-purple); }
.tag.warn  { background: var(--orange-bg);     color: var(--warning-orange); }
.tag.gray  { background: #F1F5F9;              color: var(--text-secondary); }

.chip {
  min-height: 52px; min-width: 72px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text);
  font-size: 18px; font-weight: 700; font-family: inherit;
  padding: 0 18px; margin: 6px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.chip.selected { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff; }
.chip.sm { min-height: 40px; min-width: 0; font-size: 16px; padding: 0 14px; margin: 0; }

.footer-bar { flex: none; padding: var(--sp-lg); background: var(--card-bg); border-top: 1px solid var(--border); }

.section-title {
  font-size: var(--fs-emphasis); font-weight: 700; color: var(--text);
  margin: var(--sp-lg) 0 var(--sp-sm); flex: none;
  scroll-margin-top: 52px;
}
.section-title.first { margin-top: 0; }

.input {
  background: var(--light-blue-bg); border: 1px solid var(--border); border-radius: var(--r-button);
  font-size: var(--fs-body); font-family: inherit; color: var(--text);
  padding: 14px; width: 100%;
}
.input::placeholder { color: var(--text-secondary); }

.warn-banner {
  display: flex; gap: var(--sp-sm); align-items: flex-start;
  background: var(--red-bg); border: 1px solid var(--danger-red); border-radius: var(--r-card);
  padding: var(--sp-md); color: var(--danger-red);
  font-size: 16px; font-weight: 700; line-height: 1.45; flex: none;
}
.warn-banner.info    { background: var(--light-blue-bg); border-color: var(--border); color: var(--primary-navy); }
.warn-banner.caution { background: var(--orange-bg); border-color: var(--warning-orange); color: #A16207; }

.t-body      { font-size: var(--fs-body); }
.t-emph      { font-size: var(--fs-emphasis); font-weight: 700; }
.t-title     { font-size: var(--fs-title); font-weight: 700; color: var(--primary-navy); }
.t-secondary { color: var(--text-secondary); }
.t-blue      { color: var(--primary-blue); }
.bold        { font-weight: 700; }
.stack       { display: flex; flex-direction: column; }
.grow        { flex: 1; min-width: 0; }
.gap-xs { gap: var(--sp-xs); } .gap-sm { gap: var(--sp-sm); }
.gap-md { gap: var(--sp-md); } .gap-lg { gap: var(--sp-lg); }

/* ==========================================================================
   web.css 사본 — 이 기능 전용 컴포넌트. 목업의 클래스·하위 구조를 그대로 승계.
   (뷰어 전용이던 .wf-fold / .wf-urlbar / .hub-hero / .callout 등은 뺐다)
   ========================================================================== */
.fx-ico    { width: 24px; height: 24px; flex: none; }
.fx-ico.sm { width: 20px; height: 20px; }
.fx-ico.lg { width: 28px; height: 28px; }
.fx-ico.xl { width: 40px; height: 40px; }

.fx-col   { display: flex; flex-direction: column; flex: none; min-width: 0; }
.fx-row   { display: flex; align-items: center; flex: none; min-width: 0; flex-wrap: wrap; row-gap: var(--sp-xs); }
.fx-row.top { align-items: flex-start; flex-wrap: nowrap; }
.fx-center{ text-align: center; }
.fx-cap   { font-size: 14px; line-height: 1.55; color: var(--text-secondary); }
.fx-cap16 { font-size: 16px; line-height: 1.6; color: var(--text-secondary); }
.fx-link  { font-size: 16px; font-weight: 700; color: var(--primary-blue); flex: none; }
.fx-divider { height: 1px; background: var(--border); flex: none; margin: var(--sp-md) 0; }
.fx-lead  { font-size: var(--fs-body); line-height: 1.65; }
.fx-spacer { flex: 1; min-height: var(--sp-md); }

.fx-pill {
  position: relative; flex: none;
  width: 30px; height: 30px; border-radius: var(--r-pill);
  background: #fff; border: 2px solid var(--border);
}
.fx-pill.oval { width: 38px; height: 24px; }
.fx-pill.score::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 58%; height: 2px; background: var(--border);
}

.fx-strip { display: flex; align-items: stretch; flex: none; }
.fx-strip > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.fx-strip > div + div { border-left: 1px solid var(--border); }
.fx-strip b { font-size: var(--fs-emphasis); color: var(--primary-navy); }
.fx-strip span { font-size: 14px; color: var(--text-secondary); font-weight: 700; }

.fx-chips { display: flex; flex-wrap: wrap; margin: 0 -6px; flex: none; }
.fx-chips.tight { margin: 0; gap: 8px; }
.chip.wf { min-height: 48px; font-size: 17px; padding: 0 16px; margin: 5px; }

/* ---------- 랜딩 히어로 ---------- */
.wf-hero {
  flex: none;
  background: linear-gradient(150deg, var(--primary-navy), var(--primary-blue));
  border-radius: var(--r-card);
  padding: var(--sp-lg);
  color: #fff;
  display: flex; flex-direction: column; gap: var(--sp-md);
}
/* 히어로 3종은 토큰이 아니라 하드코딩 값이라 토큰 증폭이 닿지 않는다.
   원본(14/30/16px)에서는 랜딩 부제가 본문(20px)보다 작아, 사용자가 이 화면에서
   처음 읽는 문장이 가장 작은 글씨가 된다. 본문 이상으로 올린다. */
.wf-hero .h-eyebrow { font-size: 16px; font-weight: 700; letter-spacing: .4px; color: #A9C6FF; }
.wf-hero .h-title   { font-size: 34px; font-weight: 800; line-height: 1.35; letter-spacing: -0.5px; }
.wf-hero .h-sub     { font-size: 20px; line-height: 1.7; color: #DCE8FF; }

.wf-trust { display: flex; gap: var(--sp-sm); flex: none; }
.wf-trust > div {
  flex: 1;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-button);
  padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  text-align: center;
}
.wf-trust b    { font-size: 15px; font-weight: 800; color: var(--primary-navy); }
.wf-trust span { font-size: 12px; color: var(--text-secondary); font-weight: 600; line-height: 1.4; }

/* ---------- 약국 맥락 배지 (시니어 변형 — renderLanding 전용) ---------- */
.wf-badge {
  display: flex; align-items: center; gap: var(--sp-sm); flex: none;
  background: var(--light-blue-bg); border: 1px solid var(--border); border-radius: var(--r-button);
  padding: 12px 14px;
  font-size: var(--fs-body); font-weight: 700; line-height: 1.5; color: var(--primary-navy);
}
.wf-badge svg { color: var(--primary-blue); }

/* ---------- 상단 진행 표시 (시니어 변형 — 점 3개 대신 굵은 텍스트 + 두꺼운 막대) ---------- */
.wf-stepwrap { flex: none; }
.wf-steplabel { display: block; margin-bottom: 8px; font-size: var(--fs-body); font-weight: 700; color: var(--text-secondary); }
.wf-progress { height: 12px; border-radius: var(--r-pill); background: var(--border); overflow: hidden; flex: none; }
.wf-progress .p-fill { height: 100%; border-radius: var(--r-pill); background: var(--primary-blue); }

/* ---------- 건기식 선택 그리드 ---------- */
.wf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: none; }
.wf-tile {
  background: var(--card-bg); border: 2px solid var(--border); border-radius: var(--r-card);
  padding: 14px 6px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  text-align: center; position: relative;
  min-height: 96px; justify-content: center;
  font-family: inherit; cursor: pointer;
}
.wf-tile .t-name  { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.35; }
.wf-tile .t-emoji { font-size: 26px; line-height: 1; }
.wf-tile.on { border-color: var(--primary-blue); background: var(--light-blue-bg); }
.wf-tile.on .t-name { color: var(--primary-blue); }
.wf-tile.on::after {
  content: "✓";
  position: absolute; top: -8px; right: -8px;
  width: 26px; height: 26px; border-radius: var(--r-pill);
  background: var(--primary-blue); color: #fff;
  font-size: 15px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(37,99,235,.35);
}

/* ---------- 하단 CTA 바 — 목업에선 폰 안 고정, 여기선 화면 하단에 붙는 sticky ---------- */
.wf-cta {
  flex: none; background: var(--card-bg); border-top: 1px solid var(--border);
  padding: 12px var(--sp-lg) var(--sp-md);
  position: sticky; bottom: 0; z-index: 40;
  box-shadow: 0 -6px 20px rgba(16, 42, 94, .07);
}
.wf-cta .c-count {
  font-size: 15px; font-weight: 700; color: var(--text-secondary);
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.wf-cta .c-count b { color: var(--primary-blue); }
.wf-cta .big-btn { margin: 0; }

/* ---------- 분석 중 ---------- */
.wf-scan {
  width: 132px; height: 132px; border-radius: var(--r-pill);
  background: var(--light-blue-bg); border: 3px solid var(--secondary-blue);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary-blue);
  margin: 0 auto; flex: none; position: relative;
}
.wf-scan::after { content: ""; position: absolute; inset: -14px; border-radius: var(--r-pill); border: 2px solid var(--border); }
.wf-lines { display: flex; flex-direction: column; gap: 10px; flex: none; }
.wf-line {
  display: flex; align-items: center; gap: 10px;
  font-size: 16px; line-height: 1.5; color: var(--text-secondary); font-weight: 600;
}
.wf-line.done { color: var(--text); }
.wf-line.now  { color: var(--primary-blue); font-weight: 700; }
.wf-line .l-dot {
  width: 22px; height: 22px; border-radius: var(--r-pill); flex: none;
  border: 2px solid var(--border); background: var(--card-bg);
  display: flex; align-items: center; justify-content: center;
}
.wf-line.done .l-dot { background: var(--secondary-blue); border-color: var(--secondary-blue); color: #fff; }
.wf-line.now  .l-dot { border-color: var(--primary-blue); border-width: 3px; }

/* ---------- 리포트 최상단 판정 ---------- */
.wf-verdict {
  flex: none; border-radius: var(--r-card); padding: var(--sp-lg) var(--sp-md);
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-sm);
  text-align: center;
}
.wf-verdict .v-num   { font-size: var(--fs-hero); font-weight: 800; line-height: 1.1; }
.wf-verdict .v-label { font-size: var(--fs-emphasis); font-weight: 800; }
.wf-verdict .v-sub   { font-size: 15px; line-height: 1.6; }
.wf-verdict.warn { background: var(--orange-bg); border: 2px solid var(--warning-orange); }
.wf-verdict.warn .v-num, .wf-verdict.warn .v-label { color: #A16207; }
.wf-verdict.warn .v-sub { color: #92610A; }
/* 주의 없음 — 초록을 쓰지 않는다. "안전" 오인 방지 (README §4.3) */
.wf-verdict.clear { background: var(--light-blue-bg); border: 2px solid var(--border); }
.wf-verdict.clear .v-num, .wf-verdict.clear .v-label { color: var(--primary-navy); }
.wf-verdict.clear .v-sub { color: var(--text-secondary); }

/* ---------- 상호작용 카드 ---------- */
.wf-find {
  flex: none; background: var(--card-bg);
  border: 1px solid var(--border); border-left: 5px solid var(--border);
  border-radius: 0 var(--r-card) var(--r-card) 0;
  padding: var(--sp-md);
  display: flex; flex-direction: column; gap: 10px;
}
.wf-find.lv1 { border-left-color: var(--danger-red); }
.wf-find.lv2 { border-left-color: var(--warning-orange); }
.wf-find.lv3 { border-left-color: var(--primary-blue); }
.wf-find.lv4 { border-left-color: #CBD5E1; }
.wf-find .f-lv {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: var(--r-pill);
  font-size: 14px; font-weight: 800; align-self: flex-start; flex: none;
}
.wf-find.lv1 .f-lv { background: var(--red-bg);        color: var(--danger-red); }
.wf-find.lv2 .f-lv { background: var(--orange-bg);     color: #A16207; }
.wf-find.lv3 .f-lv { background: var(--light-blue-bg); color: var(--primary-blue); }
.wf-find.lv4 .f-lv { background: #F1F5F9;              color: var(--text-secondary); }

.wf-pair { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; row-gap: 6px; }
.wf-pair .p-item {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--screen-bg); border: 1px solid var(--border);
  border-radius: var(--r-button); padding: 7px 11px;
  font-size: 16px; font-weight: 700; color: var(--text);
}
.wf-pair .p-x { font-size: 18px; font-weight: 800; color: var(--text-secondary); flex: none; }

.wf-find .f-what   { font-size: 17px; line-height: 1.6; color: var(--text); }
.wf-find .f-what b { color: var(--primary-navy); }
.wf-find .f-do {
  display: flex; gap: 8px; align-items: flex-start;
  background: var(--screen-bg); border-radius: var(--r-button);
  padding: 11px 13px;
  font-size: 16px; line-height: 1.6; font-weight: 700; color: var(--primary-navy);
}
.wf-find .f-do svg { width: 20px; height: 20px; flex: none; margin-top: 2px; color: var(--primary-blue); }

/* ---------- 약사님께 보여드리기 시트 전용 (시니어 변형 핵심) ----------
   약사가 서서 읽는다는 전제라 --fs-emphasis 이상으로 키운, wf-find 의 축약형.
   등급 — 조합 — 한 줄 설명을 한 덩어리로 붙여 보여준다. */
.wf-pharmline {
  border-radius: var(--r-card); border-left: 5px solid var(--border);
  background: var(--screen-bg); padding: 14px;
  font-size: var(--fs-emphasis); font-weight: 700; line-height: 1.55; color: var(--text);
}
.wf-pharmline.lv1 { border-left-color: var(--danger-red); }
.wf-pharmline.lv2 { border-left-color: var(--warning-orange); }
.wf-pharmline.lv3 { border-left-color: var(--primary-blue); }
.wf-pharmline.lv4 { border-left-color: #CBD5E1; }
.wf-disclaim.lg { font-size: var(--fs-emphasis); font-weight: 700; line-height: 1.6; color: var(--text); }

/* ---------- 약사님께 여쭤볼 것 ----------
   약사에게 전체 목록을 읽히면 일이 늘어난다. 물어볼 문장만 먼저 보여 주고
   근거가 되는 목록은 접어 둔다. 대화가 30초 안에 끝나는 것이 이 화면의 목적이다. */
.wf-ask { display: flex; flex-direction: column; gap: var(--sp-sm); margin: 0; padding: 0; list-style: none; }
.wf-ask li {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--light-blue-bg); border: 1px solid var(--border);
  border-radius: var(--r-card); padding: 14px 16px;
  font-size: var(--fs-emphasis); font-weight: 700; line-height: 1.5;
}
.wf-ask li .n {
  flex: none; width: 30px; height: 30px; border-radius: var(--r-pill);
  background: var(--primary-blue); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800;
}
.wf-more { border-top: 1px solid var(--border); padding-top: var(--sp-md); }
.wf-more > summary {
  cursor: pointer; list-style: none;
  font-size: var(--fs-body); font-weight: 700; color: var(--primary-blue);
  min-height: var(--min-touch); display: flex; align-items: center;
}
.wf-more > summary::-webkit-details-marker { display: none; }
.wf-more > summary::after { content: ' ▾'; }
.wf-more[open] > summary::after { content: ' ▴'; }
.wf-more .m-body { display: flex; flex-direction: column; gap: var(--sp-md); padding-top: var(--sp-md); }

/* ---------- 복용 시간표 ---------- */
.wf-time { display: flex; flex-direction: column; flex: none; }
.wf-time .tm-row { display: flex; gap: var(--sp-md); align-items: flex-start; padding: 13px 0; }
.wf-time .tm-row + .tm-row { border-top: 1px solid var(--border); }
.wf-time .tm-when {
  width: 78px; flex: none;
  font-size: 16px; font-weight: 800; color: var(--primary-navy);
  display: flex; flex-direction: column; gap: 2px;
}
.wf-time .tm-when span { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.wf-time .tm-what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.wf-time .tm-what .n   { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.5; }
.wf-time .tm-what .why { font-size: 14px; line-height: 1.5; color: var(--warning-orange); font-weight: 700; }

/* ---------- 하단 고지 (모든 리포트 필수) ---------- */
.wf-disclaim {
  flex: none;
  background: #F1F5F9; border-radius: var(--r-button);
  padding: 13px 15px;
  font-size: 13px; line-height: 1.65; color: var(--text-secondary);
}
.wf-disclaim b { color: #475569; }

/* ---------- 웹 vs 앱 비교 ---------- */
.wf-compare { display: flex; flex-direction: column; flex: none; }
.wf-compare .cp-row { display: flex; align-items: center; gap: var(--sp-sm); padding: 11px 0; font-size: 16px; line-height: 1.5; }
.wf-compare .cp-row + .cp-row { border-top: 1px solid var(--border); }
.wf-compare .cp-name { flex: 1; min-width: 0; font-weight: 700; color: var(--text); }
.wf-compare .cp-web, .wf-compare .cp-app { width: 46px; flex: none; display: flex; align-items: center; justify-content: center; }
.wf-compare .cp-web svg { width: 20px; height: 20px; color: #CBD5E1; }
/* 초록 금지 — 「앱에서 됩니다」라는 기능 표시일 뿐이지만, 주의 0건 리포트와 같은
   페이지에 초록 체크가 줄지어 있으면 「다 괜찮다」는 인상을 준다.
   이 제품은 리포트 어디에도 초록을 쓰지 않는다. */
.wf-compare .cp-app svg { width: 22px; height: 22px; color: var(--primary-blue); }
.wf-compare .cp-head { font-size: 13px; font-weight: 800; color: var(--text-secondary); padding-bottom: 8px; }
.wf-compare .cp-head .cp-app { color: var(--primary-blue); }

/* ---------- 바텀시트 ---------- */
.wf-dim { position: fixed; inset: 0; background: rgba(16, 42, 94, .34); z-index: 300; border: none; padding: 0; }
.wf-sheet {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
  width: 100%; max-width: 430px; z-index: 310;
  background: var(--card-bg);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--border);
  box-shadow: 0 -8px 28px rgba(16, 42, 94, .16);
  padding: var(--sp-md) var(--sp-lg) var(--sp-lg);
  display: flex; flex-direction: column; gap: var(--sp-md);
  max-height: 86vh; overflow-y: auto;
}
.wf-sheet .sh-grab { width: 44px; height: 5px; border-radius: var(--r-pill); background: var(--border); margin: 0 auto 2px; flex: none; }

/* ---------- 카메라 뷰 ---------- */
.wf-cam { flex: 1; background: #232B3A; position: relative; display: flex; align-items: center; justify-content: center; min-height: 340px; }
.wf-cam .cm-guide {
  width: 74%; height: 46%;
  border: 3px dashed rgba(255,255,255,.72); border-radius: var(--r-card);
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.86);
  font-size: 16px; font-weight: 700; text-align: center; line-height: 1.6;
  padding: var(--sp-md);
}
.wf-cam .cm-hint {
  position: absolute; left: var(--sp-md); right: var(--sp-md); bottom: var(--sp-md);
  background: rgba(0,0,0,.55); color: #fff;
  border-radius: var(--r-button); padding: 11px 14px;
  font-size: 14px; line-height: 1.55; text-align: center; font-weight: 600;
}
.wf-cam .cm-demo {
  position: absolute; left: var(--sp-md); right: var(--sp-md); top: var(--sp-md);
  background: #7C2D12; color: #FFE8D6;
  border-radius: var(--r-button); padding: 9px 12px;
  font-size: 13px; font-weight: 800; text-align: center;
}

/* ==========================================================================
   프로토타입 전용 (목업에 없던 것 — 전부 wf- 접두사)
   ========================================================================== */
.wf-searchinput {
  border: none; background: transparent; outline: none;
  font-family: inherit; font-size: var(--fs-body); font-weight: 700; color: var(--text);
  width: 100%; padding: 0;
}
.wf-searchinput::placeholder { font-weight: 400; color: var(--text-secondary); }

.wf-toast {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
  z-index: 400;
  background: rgba(16, 42, 94, .94); color: #fff;
  border-radius: var(--r-pill); padding: 12px 20px;
  font-size: 15px; font-weight: 700; line-height: 1.5;
  max-width: 92vw; text-align: center;
  box-shadow: 0 8px 24px rgba(16, 42, 94, .3);
}
.wf-toast[hidden] { display: none; }

.wf-anchor { scroll-margin-top: 52px; }
.wf-x { background: none; border: none; font-family: inherit; cursor: pointer; padding: 0 0 0 6px; color: var(--text-secondary); font-size: 16px; font-weight: 800; }
</style>
</head>

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nameOf(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
  return id;
}
const rxName   = function (id) { return nameOf(RX_LIST, id); };
const suppName = function (id) { return nameOf(SUPP_LIST, id); };
const condName = function (id) { return nameOf(COND_LIST, id); };
function has(arr, id) { return arr.indexOf(id) !== -1; }

/* 받침에 따라 은/는 을 고른다. 「은행잎는」 같은 문장이 나오면 화면 신뢰가 깎인다.
   숫자·영문으로 끝나면 목업 표기(오메가3는)를 따라 '는'. */
function eunNeun(word) {
  const c = word.charCodeAt(word.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return ((c - 0xAC00) % 28) ? '은' : '는';
  return '는';
}
/* 「아스피린이랑」/「오메가3랑」 — 약사님께 여쭤볼 문장을 만들 때 쓴다. */
function iRang(word) {
  const c = word.charCodeAt(word.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return word + (((c - 0xAC00) % 28) ? '이랑' : '랑');
  return word + '이랑';        // 숫자·영문으로 끝나면(예: 오메가3) 「이랑」이 자연스럽다
}
function ico(id, cls) { return '<svg class="' + (cls || 'fx-ico') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }

/* '없어요' / '해당 없음' 은 항목이 아니라 "항목 없음"의 표시다. 분석에서 걷어낸다. */
function realRx()    { return state.rx.filter(function (id) { return id !== 'none'; }); }
function realConds() { return state.conds.filter(function (id) { return id !== 'none'; }); }

/* 대조 대상 개수 M 과 쌍의 수 K. 직접 입력 항목은 분석하지 않으므로 여기에 넣지 않는다. */
function itemCount() { return realRx().length + state.supps.length; }
function pairCount() { var m = itemCount(); return m * (m - 1) / 2; }

/* ==========================================================================
   4. 분석 — 규칙 데이터를 훑기만 한다. 조합 지식은 여기에 없다.
   ========================================================================== */
function analyze() {
  const rx = realRx(), supps = state.supps, conds = realConds();
  const findings = [];

  RULES.forEach(function (r) {
    if (has(rx, r.rx) && has(supps, r.supp)) {
      findings.push({
        level: r.level, pair: [rxName(r.rx), suppName(r.supp)],
        what: r.what, how: r.how, supp: r.supp, why: r.why, suppSlot: r.suppSlot
      });
    }
  });

  RX_PAIR_RULES.forEach(function (r) {
    if (has(rx, r.a) && has(rx, r.b)) {
      findings.push({ level: r.level, pair: [rxName(r.a), rxName(r.b)], what: r.what, how: r.how });
    }
  });

  INFO_RULES.forEach(function (r) {
    const w = r.when;
    const ok =
      (w.rx    || []).every(function (id) { return has(rx, id); }) &&
      (w.supps || []).every(function (id) { return has(supps, id); }) &&
      (w.conds || []).every(function (id) { return has(conds, id); }) &&
      (w.rxNot || []).every(function (id) { return !has(rx, id); }) &&
      (!w.condsAny || w.condsAny.some(function (id) { return has(conds, id); }));
    if (ok) findings.push({ level: 'info', pair: r.pair, what: r.what, how: r.how });
  });

  const order = { warn: 0, time: 1, check: 2, info: 3 };
  findings.sort(function (a, b) { return order[a.level] - order[b.level]; });

  const counts = { warn: 0, time: 0, check: 0, info: 0 };
  findings.forEach(function (f) { counts[f.level]++; });

  /* N 은 등급이 있는 것만 센다. 알아두기(info)는 "확인이 필요한 건수"가 아니다. */
  return { findings: findings, counts: counts, n: counts.warn + counts.time + counts.check };
}

/* SPEC §5 — 기본 배치 후 time 규칙의 suppSlot 으로 옮긴다. */
function buildSchedule(result) {
  const bySupp = {};
  result.findings.forEach(function (f) {
    if (f.level !== 'time' || !f.supp) return;
    if (!bySupp[f.supp]) bySupp[f.supp] = { slot: f.suppSlot, whys: [] };
    if (bySupp[f.supp].whys.indexOf(f.why) === -1) bySupp[f.supp].whys.push(f.why);
  });

  const rows = {};
  SLOTS.forEach(function (s) { rows[s.id] = []; });

  realRx().forEach(function (id) {
    rows[DEFAULT_SLOT[id]].push({ name: rxName(id), why: '' });
  });
  state.supps.forEach(function (id) {
    const moved = bySupp[id];
    const slot = moved ? moved.slot : DEFAULT_SLOT[id];
    rows[slot].push({ name: suppName(id), why: moved ? moved.whys.join(' · ') : '' });
  });

  return SLOTS.filter(function (s) { return rows[s.id].length > 0; })
              .map(function (s) { return { slot: s, items: rows[s.id] }; });
}


/* ==========================================================================
   5. URL 해시 (SPEC §7) — #r=anti,thy&s=omega3,calmag&a=50&c=none
      x= 는 직접 입력 항목. 스펙에 없지만 없으면 링크로 결과가 재현되지 않는다.
   ========================================================================== */
function buildHash() {
  const parts = [
    'r=' + state.rx.join(','),
    's=' + state.supps.join(','),
    'a=' + (state.age || ''),
    'c=' + state.conds.join(',')
  ];
  if (state.customs.length) {
    parts.push('x=' + state.customs.map(encodeURIComponent).join(','));
  }
  return '#' + parts.join('&');
}
function reportUrl() { return location.href.split('#')[0] + buildHash(); }

function parseHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return null;
  const out = {};
  raw.split('&').forEach(function (kv) {
    const i = kv.indexOf('=');
    if (i === -1) return;
    out[kv.slice(0, i)] = kv.slice(i + 1);
  });
  if (!('r' in out) && !('s' in out) && !('a' in out) && !('c' in out)) return null;

  const split = function (v, valid) {
    if (!v) return [];
    return v.split(',').filter(function (x) { return x && valid.indexOf(x) !== -1; });
  };
  const rxIds   = RX_LIST.map(function (o) { return o.id; });
  const suppIds = SUPP_LIST.map(function (o) { return o.id; });
  const ageIds  = AGE_LIST.map(function (o) { return o.id; });
  const condIds = COND_LIST.map(function (o) { return o.id; });

  return {
    rx: split(out.r, rxIds),
    supps: split(out.s, suppIds),
    age: has(ageIds, out.a) ? out.a : null,
    conds: split(out.c, condIds),
    customs: out.x ? out.x.split(',').filter(Boolean).map(decodeURIComponent) : []
  };
}
function applyParsed(p) {
  state.rx = p.rx; state.supps = p.supps; state.age = p.age;
  state.conds = p.conds; state.customs = p.customs;
}

   6. 화면 전환 — history.pushState 로 뒤로가기를 살린다 (SPEC §2)
   ========================================================================== */
function go(screen, opts) {
  opts = opts || {};
  state.screen = screen;
  state.sheet = opts.sheet || null;
  state.appNotice = false;
  state.copyFallback = '';

  const url = (screen === 'report')
    ? location.pathname + location.search + buildHash()
    : location.pathname + location.search;
  const snapshot = { screen: screen, sheet: state.sheet };

  /* file:// 로 그냥 열었을 때 일부 브라우저는 pushState 에 SecurityError 를 던진다.
     그때도 화면 전환 자체는 살아 있어야 한다 — 뒤로가기만 포기한다. */
  try {
    if (opts.replace) history.replaceState(snapshot, '', url);
    else history.pushState(snapshot, '', url);
  } catch (e) {
    if (screen === 'report') location.hash = buildHash().slice(1);
  }

  render();
  if (!opts.keepScroll) window.scrollTo(0, 0);
}

window.addEventListener('popstate', function (e) {
  const s = e.state;
  if (s && s.screen) {
    state.screen = s.screen;
    state.sheet = s.sheet || null;
  } else {
    /* 히스토리 진입점 — 해시가 있으면 리포트, 없으면 랜딩 */
    const p = parseHash();
    if (p) { applyParsed(p); state.screen = 'report'; } else { state.screen = 'landing'; }
    state.sheet = null;
  }
  state.appNotice = false;
  state.copyFallback = '';
  render();
  window.scrollTo(0, 0);
});

/* ---------- 약사님께 보여드리기 시트 (시니어 변형 핵심) ----------
   renderReport() 의 analyze() 결과를 그대로 다시 계산해 쓴다 — 상태만 보는
   순수 함수라 여기서 다시 불러도 결과가 달라지지 않는다. */
function renderPharmacistSheet() {
  const res = analyze();
  const rx = realRx();
  const rxText   = rx.length ? rx.map(rxName).join(' · ') : '없음';
  const suppText = state.supps.length ? state.supps.map(suppName).join(' · ') : '없음';

  const findingsHtml = res.findings.length
    ? '<div class="fx-col gap-md">' + res.findings.map(function (f) {
        const L = LEVELS[f.level];
        return '<div class="wf-pharmline ' + L.cls + '">' +
          '<b>' + L.label + '</b> — ' + f.pair.join(' × ') + ' — ' + f.what +
        '</div>';
      }).join('') + '</div>'
    : '<div class="wf-pharmline lv4">확인된 주의 신호는 없습니다. 다만 아무 문제가 없다는 뜻은 아닙니다.</div>';

  /* 여쭤볼 문장 — findings 는 이미 심각도 순으로 정렬돼 있으므로 앞에서 3개만 쓴다.
     약국에서 오가는 대화는 짧다. 목록을 다 읽히는 대신 물어볼 말을 만들어 준다. */
  const ASK = {
    warn:  '같이 먹어도 되는지',
    time:  '몇 시간 띄워서 먹어야 하는지',
    check: '같이 먹어도 괜찮은지',
    info:  '함께 먹을 때 주의할 게 있는지'
  };
  const asks = res.findings.slice(0, 3).map(function (f) {
    const tail = ASK[f.level] || ASK.check;
    return f.pair.length >= 2
      ? iRang(f.pair[0]) + ' ' + f.pair[1] + ' ' + tail
      : f.pair.join(' · ') + ' ' + tail;
  });
  if (!asks.length) asks.push('지금 먹는 조합에서 따로 주의할 게 있는지');

  const askHtml = '<ol class="wf-ask">' + asks.map(function (q, i) {
    return '<li><span class="n">' + (i + 1) + '</span><span>' + esc(q) + '</span></li>';
  }).join('') + '</ol>';

  const moreCount = Math.max(0, res.findings.length - asks.length);

  return '<div class="wf-dim" data-act="close-sheet"></div>' +
    '<div class="wf-sheet" role="dialog" aria-label="약사님께 여쭤볼 것">' +
      '<div class="sh-grab"></div>' +
      '<div class="t-title">약사님께 여쭤볼 것</div>' +
      '<div class="fx-cap16">이 화면을 보여드리고 아래만 여쭤보시면 됩니다.</div>' +
      askHtml +
      '<details class="wf-more">' +
        '<summary>확인한 약·영양제와 분석 결과 전체 보기' +
          (moreCount ? ' (' + moreCount + '건 더)' : '') + '</summary>' +
        '<div class="m-body">' +
          '<div class="fx-col gap-xs">' +
            '<span class="t-emph">처방약</span>' +
            '<span class="t-emph t-secondary">' + rxText + '</span>' +
          '</div>' +
          '<div class="fx-col gap-xs">' +
            '<span class="t-emph">건강기능식품</span>' +
            '<span class="t-emph t-secondary">' + suppText + '</span>' +
          '</div>' +
          '<span class="t-emph">분석 결과</span>' +
          findingsHtml +
        '</div>' +
      '</details>' +
      '<div class="wf-disclaim lg">이 요약은 검수 전 프로토타입이 만든 것입니다. 약사님의 판단을 대신하지 않습니다.</div>' +
      '<button class="big-btn primary" data-act="close-sheet">닫기</button>' +
    '</div>';
}

    '<div class="t-title">마지막으로<br>두 가지만요</div>' +
    '<div class="section-title first">연세가 어떻게 되세요?</div>' +
    '<div class="fx-chips tight">' + ages + '</div>' +
    '<div class="section-title">해당되는 것이 있나요?</div>' +
    '<div class="fx-chips tight">' + conds + '</div>' +
    '<div class="fx-divider"></div>' +
    '<div class="card fx-strip">' +
      '<div><b>' + realRx().length + '</b><span>처방약</span></div>' +
      '<div><b>' + state.supps.length + '</b><span>건강기능식품</span></div>' +
      '<div><b>' + pairCount() + '</b><span>확인할 조합</span></div>' +
    '</div>' +
    (state.customs.length
      ? '<div class="fx-cap">직접 입력하신 ' + state.customs.length + '개는 대조 대상에서 빠지고, 리포트에 그대로 실립니다.</div>'
      : '') +
  '</div>' +
  '<div class="wf-cta"><button class="big-btn primary" data-act="analyze">' +
    ico('i-shield-check') + '분석하기</button></div>';
}

/* ---------- A5 분석 중 ---------- */
function renderAnalyzing() {
  const lines = [
    '고르신 ' + itemCount() + '개를 정리했어요',
    '만나는 ' + pairCount() + '쌍을 대조하는 중',
    '리포트를 만들고 있어요'
  ];
  const html = lines.map(function (t, i) {
    const cls = i < state.step ? 'wf-line done' : (i === state.step ? 'wf-line now' : 'wf-line');
    return '<div class="' + cls + '"><span class="l-dot">' +
      (i < state.step ? ico('i-check', 'fx-ico sm') : '') + '</span><span>' + t + '</span></div>';
  }).join('');

  return '<div class="screen-body gap-lg">' +
    '<div class="fx-spacer"></div>' +
    '<div class="wf-scan">' + ico('i-shield-check', 'fx-ico xl') + '</div>' +
    '<div class="t-title fx-center">조합을 확인하고 있어요</div>' +
    '<div class="wf-lines">' + html + '</div>' +
    '<div class="fx-spacer"></div>' +
    '<div class="fx-cap fx-center">잠시만요. 곧 끝납니다.</div>' +
  '</div>';
}

/* ---------- A6~A9 + C1 리포트 (한 페이지 스크롤) ---------- */
function renderReport() {
  const res = analyze();
  const m = itemCount(), k = pairCount();
  const rx = realRx();

  /* 6.1 판정 블록 */
  const verdict = res.n > 0
    ? '<div class="wf-verdict warn"><div class="v-num">' + res.n + '</div>' +
      '<div class="v-label">가지 확인이 필요해요</div>' +
      '<div class="v-sub">드시는 ' + m + '개가 만나는 ' + k + '쌍을 대조한 결과입니다</div></div>'
    : '<div class="wf-verdict clear"><div class="v-num">0</div>' +
      '<div class="v-label">확인된 주의 신호는 없습니다</div>' +
      '<div class="v-sub">다만 아무 문제가 없다는 뜻은 아닙니다. 아래를 꼭 읽어 주세요.</div></div>';

  const strip = '<div class="card fx-strip">' +
    '<div><b>' + res.counts.warn + '</b><span>주의</span></div>' +
    '<div><b>' + res.counts.time + '</b><span>시간 조정</span></div>' +
    '<div><b>' + res.counts.check + '</b><span>확인 권장</span></div></div>';

  /* 확인한 것 */
  const listOr = function (ids, f) {
    return ids.length ? ids.map(f).join(' · ') : '고르신 것이 없습니다';
  };
  const checked = '<div class="card fx-col gap-sm">' +
    '<div class="fx-row gap-sm"><span class="tag ' + (rx.length ? 'rx' : 'gray') + '">처방약 ' + rx.length + '</span>' +
      '<span class="fx-cap">' + listOr(rx, rxName) + '</span></div>' +
    '<div class="fx-row gap-sm"><span class="tag ' + (state.supps.length ? 'suppl' : 'gray') + '">건강기능식품 ' + state.supps.length + '</span>' +
      '<span class="fx-cap">' + listOr(state.supps, suppName) + '</span></div>' +
    (state.age ? '<div class="fx-row gap-sm"><span class="tag gray">' + nameOf(AGE_LIST, state.age) + '</span>' +
      '<span class="fx-cap">' + (realConds().length ? realConds().map(condName).join(' · ') : '해당 사항 없음') + '</span></div>' : '') +
  '</div>';

  /* 6.2 / A7 상호작용 카드 */
  const cards = res.findings.map(function (f) {
    const L = LEVELS[f.level];
    return '<div class="wf-find ' + L.cls + '">' +
      '<span class="f-lv">' + ico(L.icon, 'fx-ico sm') + L.label + '</span>' +
      '<div class="wf-pair">' + f.pair.map(function (p, i) {
        return (i ? '<span class="p-x">×</span>' : '') + '<span class="p-item">' + p + '</span>';
      }).join('') + '</div>' +
      '<div class="f-what">' + f.what + '</div>' +
      '<div class="f-do">' + ico(L.doIcon) + '<span>' + f.how + '</span></div>' +
    '</div>';
  }).join('');

  const findingsSection = res.findings.length
    ? '<div class="section-title wf-anchor" id="findings">무엇이 문제인가요</div>' +
      '<div class="fx-col gap-md">' + cards + '</div>'
    : '';

  /* A8 복용 시간표 */
  const sched = buildSchedule(res);
  const warnSupps = res.findings.filter(function (f) { return f.level === 'warn'; })
    .map(function (f) { return suppName(f.supp); })
    .filter(function (v, i, a) { return a.indexOf(v) === i; });

  const timeSection = sched.length
    ? '<div class="section-title wf-anchor" id="timetable">오늘부터 이렇게 드셔 보세요</div>' +
      '<div class="fx-cap16">시간만 바꿔도 해결되는 것이 있습니다.</div>' +
      '<div class="card" style="margin-top:8px">' +
        '<div class="wf-time">' + sched.map(function (row) {
          const plain = row.items.filter(function (it) { return !it.why; });
          const moved = row.items.filter(function (it) { return it.why; });
          return '<div class="tm-row">' +
            '<div class="tm-when">' + row.slot.label + '<span>' + row.slot.time + '</span></div>' +
            '<div class="tm-what">' +
              (plain.length ? '<div class="n">' + plain.map(function (it) { return it.name; }).join(' · ') + '</div>' : '') +
              moved.map(function (it) {
                return '<div class="n">' + it.name + '</div><div class="why">' + it.why + '</div>';
              }).join('') +
            '</div></div>';
        }).join('') + '</div>' +
      '</div>' +
      (warnSupps.length
        ? '<div class="warn-banner caution" style="margin-top:16px">' + ico('i-alert-triangle') +
          '<span>' + warnSupps.join(' · ') + eunNeun(warnSupps[warnSupps.length - 1]) +
          ' 시간을 띄운다고 해소되는 항목이 아닙니다. 함께 드시는 것 자체를 진료 때 상의해 주세요.</span></div>'
        : '') +
      '<div class="wf-disclaim" style="margin-top:16px"><b>복용 시간 제안은 일반적인 기준입니다.</b> ' +
        '처방전에 적힌 복용법이 우선이며, 바꾸기 전에 약사에게 확인해 주세요.</div>'
    : '';

  /* 6.2 무엇을 확인하지 못했나요 — N 과 무관하게 항상 */
  const missItem = function (html) {
    return '<div class="fx-row top gap-sm">' + ico('i-alert-circle', 'fx-ico sm t-secondary') +
      '<span class="t-body grow">' + html + '</span></div>';
  };
  const notChecked = '<div class="section-title wf-anchor" id="notchecked">무엇을 확인하지 못했나요</div>' +
    '<div class="card fx-col gap-sm">' +
      missItem('얼마나, 언제 드시는지 (복용량과 복용 시점)') +
      missItem('신장·간 기능 등 몸 상태') +
      missItem('같은 이름이라도 <b>함량이 다른 제품</b>') +
      (state.customs.length
        ? missItem('직접 입력하신 항목: <b>' + state.customs.map(esc).join(' · ') + '</b>')
        : '') +
    '</div>';

  /* A9 앱 전환 */
  const cmp = [
    ['이번 조합 1회 분석', true],
    ['결과 저장하고 다시 보기', false],
    ['약이 바뀌면 자동으로 재확인', false],
    ['복용 시간 알람', false],
    ['약봉투 사진으로 자동 등록', false]
  ].map(function (r) {
    return '<div class="cp-row"><span class="cp-name">' + r[0] + '</span>' +
      '<span class="cp-web">' + ico(r[1] ? 'i-check' : 'i-minus') + '</span>' +
      '<span class="cp-app">' + ico('i-check') + '</span></div>';
  }).join('');

  const appSection =
    '<div class="section-title wf-anchor" id="save">약은 계속 바뀝니다</div>' +
    '<div class="card elevated fx-col gap-sm">' +
      '<div class="fx-lead">오늘 결과는 <b>오늘 조합</b> 기준이에요. 약이 하나만 바뀌어도 결과가 달라집니다.</div>' +
    '</div>' +
    '<div class="section-title">웹에서 되는 것, 앱에서 되는 것</div>' +
    '<div class="card"><div class="wf-compare">' +
      '<div class="cp-row cp-head"><span class="cp-name"></span><span class="cp-web">웹</span><span class="cp-app">앱</span></div>' +
      cmp +
    '</div></div>' +
    '<button class="row-card" data-act="open-pharmacist-sheet" style="margin-top:10px">' +
      '<div class="icon-box">' + ico('i-users') + '</div>' +
      '<div class="grow stack gap-xs"><span class="t-body bold">약국에서 도움받기</span>' +
      '<span class="fx-cap">약사님께 여쭤볼 것을 정리해 드릴게요</span></div>' +
      ico('i-chevron-right', 'fx-ico t-secondary') +
    '</button>' +
    '<div style="height:8px"></div>' +
    '<button class="big-btn primary" data-act="app-soon">' + ico('i-smartphone') + '앱에서 계속 관리하기</button>' +
    (state.appNotice
      ? '<div class="warn-banner info">' + ico('i-alert-circle') +
        '<span>앱 출시 후 연결됩니다. 아직 받으실 수 있는 앱이 없어 링크를 걸어 두지 않았습니다.</span></div>'
      : '') +
    '<button class="big-btn secondary" data-act="copy-link">' + ico('i-share') + '결과 링크 복사</button>' +
    (state.copyFallback
      ? '<div class="fx-col gap-sm"><span class="fx-cap">브라우저가 복사를 막았습니다. 아래 주소를 직접 복사해 주세요.</span>' +
        '<input class="input" readonly value="' + esc(state.copyFallback) + '" onclick="this.select()"></div>'
      : '') +
    '<div class="fx-cap fx-center">이 링크에는 어떤 약을 고르셨는지가 담깁니다. 보내실 곳을 확인해 주세요.</div>';

  return '<div class="screen-body gap-md">' +
    verdict +
    strip +
    '<div class="section-title">확인한 것</div>' +
    checked +
    (res.findings.length
      ? '<button class="big-btn primary" data-act="scrollto" data-target="findings">무엇이 문제인지 보기' + ico('i-arrow-down') + '</button>'
      : '') +
    findingsSection +
    (sched.length && res.findings.length
      ? '<button class="big-btn primary" data-act="scrollto" data-target="timetable">그럼 어떻게 먹어야 하나요?' + ico('i-arrow-down') + '</button>'
      : '') +
    timeSection +
    notChecked +
    '<div class="warn-banner caution">' + ico('i-repeat') +
      '<span>약이 바뀌면 결과도 바뀝니다. 새 약을 받으시면 다시 확인해 주세요.</span></div>' +
    '<div class="wf-disclaim">' + DISCLAIMER + '</div>' +
    appSection +
    '<div class="fx-divider"></div>' +
    '<button class="big-btn primary" data-act="open-pharmacist-sheet">' + ico('i-users') + '약사님께 여쭤볼 것 정리하기</button>' +
    '<div class="fx-divider"></div>' +
    '<button class="big-btn ghost" data-act="restart">다른 조합으로 다시 해보기</button>' +
  '</div>';
}


/* ==========================================================================
   8. 렌더 — 화면 하나당 함수 하나
   ========================================================================== */
const RENDERERS = {
  landing: renderLanding,
  rx: renderRx,
  search: renderSearch,
  cam: renderCam,
  ocr: renderOcr,
  supp: renderSupp,
  profile: renderProfile,
  analyzing: renderAnalyzing,
  report: renderReport
};

function render() {
  app.innerHTML = RENDERERS[state.screen]();
  sheetRoot.innerHTML = renderSheet();
  document.body.style.overflow = state.sheet ? 'hidden' : '';
  if (state.sheet === 'custom') {
    const el = document.getElementById('custom-input');
    if (el) el.focus();
  }
  if (state.screen === 'search') {
    const q = document.getElementById('q');
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
}


/* ==========================================================================
   9. 동작
   ========================================================================== */

/* '없어요'/'해당 없음' 은 나머지와 배타 (SPEC §3) */
function toggleExclusive(arr, id, noneId) {
  if (id === noneId) return has(arr, noneId) ? [] : [noneId];
  const next = arr.filter(function (x) { return x !== noneId; });
  return has(next, id) ? next.filter(function (x) { return x !== id; }) : next.concat([id]);
}

let analyzeToken = 0;
function startAnalyze() {
  const token = ++analyzeToken;
  state.step = 0;
  go('analyzing');
  const stepAt = function (ms, n) {
    setTimeout(function () {
      if (token !== analyzeToken || state.screen !== 'analyzing') return;
      state.step = n;
      render();
    }, ms);
  };
  stepAt(850, 1);
  stepAt(1700, 2);
  setTimeout(function () {
    if (token !== analyzeToken || state.screen !== 'analyzing') return;
    /* 분석 화면은 히스토리에서 리포트로 덮어쓴다. 리포트에서 뒤로가면
       분석이 다시 돌지 않고 곧장 기본정보 화면으로 돌아가야 하기 때문. */
    go('report', { replace: true });
  }, 2500);
}

function copyLink() {
  const url = reportUrl();
  const done = function () { toast('복사했습니다'); };
  const fail = function () { state.copyFallback = url; render(); };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(function () { legacyCopy(url, done, fail); });
  } else {
    legacyCopy(url, done, fail);
  }
}
function legacyCopy(text, done, fail) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? done() : fail();
  } catch (e) { fail(); }
}

const ACTIONS = {
  start:      function () { go('rx'); },
  back:       function () { history.back(); },
  'open-rx-help': function () { go('rx', { sheet: 'rx-help', keepScroll: true }); },
  'to-search':function () { go('search'); },
  'to-cam':   function () { go('cam'); },
  'to-ocr':   function () { go('ocr'); },
  'to-supp':  function () { go('supp'); },
  'to-profile': function () { go('profile'); },
  analyze:    function () { startAnalyze(); },
  restart:    function () {
    state.rx = []; state.supps = []; state.customs = []; state.age = null;
    state.conds = []; state.q = ''; state.ocrPick = OCR_DEMO.map(function (o) { return o.sure; });
    go('landing');
  },

  'rx-toggle': function (el) {
    state.rx = toggleExclusive(state.rx, el.dataset.id, 'none');
    render();
  },
  'supp-toggle': function (el) {
    const id = el.dataset.id;
    state.supps = has(state.supps, id)
      ? state.supps.filter(function (x) { return x !== id; })
      : state.supps.concat([id]);
    render();
  },
  age:  function (el) { state.age = el.dataset.id; render(); },
  cond: function (el) { state.conds = toggleExclusive(state.conds, el.dataset.id, 'none'); render(); },

  'open-custom':  function () { go('supp', { sheet: 'custom', keepScroll: true }); },
  'open-pharmacist-sheet': function () { go('report', { sheet: 'pharmacist', keepScroll: true }); },
  'close-sheet':  function () { history.back(); },
  'del-custom':   function (el) { state.customs.splice(Number(el.dataset.i), 1); render(); },

  'pick-drug': function (el) {
    const d = DRUG_SEARCH[Number(el.dataset.i)];
    if (!has(state.rx, d.rx)) state.rx = toggleExclusive(state.rx, d.rx, 'none');
    toast(d.name + ' → ' + rxName(d.rx) + '으로 담았습니다');
    render();
  },
  'ocr-toggle': function (el) {
    const i = Number(el.dataset.i);
    state.ocrPick[i] = !state.ocrPick[i];
    render();
  },
  'ocr-confirm': function () {
    OCR_DEMO.forEach(function (o, i) {
      if (state.ocrPick[i] && !has(state.rx, o.rx)) state.rx = toggleExclusive(state.rx, o.rx, 'none');
    });
    const n = state.ocrPick.filter(Boolean).length;
    go('rx');
    toast(n + '개를 담았습니다');
  },

  scrollto: function (el) {
    const t = document.getElementById(el.dataset.target);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  'app-soon':  function () { state.appNotice = true; render(); },
  'copy-link': function () { copyLink(); }
};

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'FORM') return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el);
});

document.addEventListener('submit', function (e) {
  const el = e.target.closest('[data-act="add-custom"]');
  if (!el) return;
  e.preventDefault();
  const input = document.getElementById('custom-input');
  const v = (input.value || '').trim();
  if (!v) return;
  if (state.customs.length >= 8) { toast('여덟 개까지 적으실 수 있어요'); return; }
  state.customs.push(v);
  render();
});

/* 검색은 결과 영역만 다시 그린다. 화면 전체를 다시 그리면 입력 포커스가 튄다. */
document.addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  const box = document.getElementById('search-results');
  if (box) box.innerHTML = searchResults();
});


/* ==========================================================================
   10. 진입 — 해시가 있으면 랜딩을 건너뛰고 바로 리포트 (SPEC §7)
   ========================================================================== */
const parsed = parseHash();
if (parsed) { applyParsed(parsed); state.screen = 'report'; }
try { history.replaceState({ screen: state.screen, sheet: null }, '', location.href); } catch (e) { /* file:// 대비 */ }
render();

})();
</script>
